    <div class="card"><h3>What each role can do</h3><div class="tw"><table class="t"><thead><tr><th>Role</th><th>Can do</th></tr></thead><tbody>
    <tr><td>Administrator</td><td>Everything, including users, settings, backup &amp; restore</td></tr>
    <tr><td>Department Head</td><td>Encode all documents, master data, void documents, close/cancel POs, opening balance</td></tr>
    <tr><td>Operations Head</td><td>Create &amp; close production batches, encode consumption/output/receiving/withdrawals</td></tr>
    <tr><td>Warehouse Staff</td><td>Encode POs, receiving, consumption, output, client POs, withdrawals, recrushing</td></tr>
    <tr><td>Auditor</td><td>View and export everything (read-only), including the audit log</td></tr></tbody></table></div></div>`;
  const r = S.users.slice().sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  LST().innerHTML = `<div class="tw"><table class="t"><thead><tr><th>Name</th><th>Username</th><th>Position</th><th>System role</th><th>Email</th><th>Status</th></tr></thead><tbody>${r.map(u => `<tr class="click" data-id="${esc(u.id)}"><td><div class="row" style="flex-wrap:nowrap">${avatar(u.name, u.username || u.id)}<b>${esc(u.name)}</b></div></td><td>${u.username ? esc(u.username) : '<span class="tag warn">not set</span>'}</td><td>${esc(u.position)}</td><td>${ROLES[u.role] || esc(u.role)}</td><td>${esc(u.email)}</td><td>${u.active === false ? tag('Disabled') : '<span class="tag ok">Active</span>'}</td></tr>`).join('')}</tbody></table></div>`;
  const roleOpts = sel => Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${v}</option>`).join('');
  const posList = `<datalist id="pos-dl">${POSITIONS.map(p => `<option value="${esc(p)}">`).join('')}</datalist>`;
  const checkUser = async (un, selfId) => {
    if (!validUser(un)) fail('Username: 3–30 characters, lowercase letters, numbers, dot, dash or underscore (e.g. mlopez).');
    const d = await DB.get('directory', un); if (d && d.uid !== selfId) fail(`Username "${un}" is already taken.`);
  };
  // CPS team: everyone who will use the system, ready to add (the Administrator only types email + temporary password)
  const added = ([name, un]) => S.users.some(u => u.username === un || (u.name || '').trim().toLowerCase() === name.toLowerCase());
  const left = CPS_TEAM.filter(p => !added(p));
  $('#team').innerHTML = `<h3>CPS team</h3><p class="muted" style="margin-top:0">${left.length ? `Click <b>Add</b> for each person. Name, username, position and system role are filled in; enter their email and a temporary password.` : 'Everyone in the CPS team has an account.'}</p>
    <div class="tw"><table class="t"><thead><tr><th>Name</th><th>Username</th><th>Position</th><th>System role</th><th></th></tr></thead><tbody>${CPS_TEAM.map(p => `<tr><td><div class="row" style="flex-wrap:nowrap">${avatar(p[0], p[1])}<b>${esc(p[0])}</b></div></td><td>${esc(p[1])}</td><td>${esc(p[2])}</td><td>${ROLES[p[3]]}</td><td class="n">${added(p) ? '<span class="tag ok">Added</span>' : `<button class="btn sm pri" data-team="${esc(p[1])}">Add</button>`}</td></tr>`).join('')}</tbody></table></div>`;
  $('#team').onclick = e => { const b = e.target.closest('[data-team]'); if (!b) return; const p = CPS_TEAM.find(x => x[1] === b.dataset.team); addDlg({ name: p[0], username: p[1], position: p[2], role: p[3] }); };
  const addDlg = (pf = {}) => {
    const m = modal(pf.name ? `Add ${esc(pf.name)}` : 'Add User', `<form id="uf" class="stack"><label class="f">Full name *<input name="name" required placeholder="e.g. Mike Renzel Lopez" value="${esc(pf.name || '')}"></label>
      <div class="grid"><label class="f">Username * (for signing in)<input name="username" required autocapitalize="none" spellcheck="false" placeholder="e.g. mlopez" value="${esc(pf.username || '')}"></label><label class="f">Position *<input name="position" list="pos-dl" required placeholder="e.g. MIC Staff" value="${esc(pf.position || '')}"></label></div>${posList}
      <label class="f">Email * (for password resets)<input type="email" name="email" required></label><label class="f">Temporary password * (min. 6 characters)<input name="pw" required minlength="6"></label><label class="f">System role * (what they can do)<select name="role">${roleOpts(pf.role || 'staff')}</select></label><div class="row"><span class="sp"></span><button type="button" class="btn" data-close>Cancel</button><button class="btn pri">Create User</button></div></form>`);
    if (pf.name) m.$('[name=email]').focus();
    // Suggest a username (first letter + last name) while the name is typed, until the username is edited by hand
    const unEl = m.$('[name=username]'); if (pf.username) unEl.dataset.touched = 1; unEl.addEventListener('input', () => { unEl.dataset.touched = 1; });
    m.$('[name=name]').addEventListener('input', e => { if (unEl.dataset.touched) return; const w = e.target.value.trim().toLowerCase().split(/\s+/).filter(Boolean); unEl.value = w.length > 1 ? (w[0][0] + w[w.length - 1]).replace(/[^a-z0-9._-]/g, '') : ''; });
    onSubmit(m.$('#uf'), async f => {
      const un = normUser(f.username); await checkUser(un);
      const uid = await AUTH.createUser(f.email, f.pw);
      await DB.tx(async t => {
        t.set('users', uid, { name: f.name, username: un, position: f.position, email: f.email.toLowerCase(), role: f.role, active: true, createdAt: nowISO(), createdBy: ME.uid });
        t.set('directory', un, { uid, username: un, name: f.name, position: f.position, email: f.email.toLowerCase(), active: true });
        audit(t, 'Create', 'users', uid, un, `${f.name} (${f.position}) as ${ROLES[f.role]}`);
      });
      toast(`User created. Give ${f.name} the username "${un}" and the temporary password.`, 'ok'); m.close();
    });
  };
  $('#new').onclick = () => addDlg();
  $('#lst').onclick = e => {
    const tr = e.target.closest('tr[data-id]'); if (!tr) return; const u = S.users.find(x => x.id === tr.dataset.id);
    const self = u.id === ME.uid;
    const m = modal(esc(u.name), `<form id="uf" class="stack"><label class="f">Full name<input name="name" value="${esc(u.name)}" required></label>
      <div class="grid"><label class="f">Username<input name="username" value="${esc(u.username)}" ${u.username ? 'readonly' : 'required placeholder="set a username"'} autocapitalize="none"></label><label class="f">Position<input name="position" list="pos-dl" value="${esc(u.position)}" required></label></div>${posList}
      <label class="f">Email<input value="${esc(u.email)}" readonly></label><label class="f">System role<select name="role" ${self ? 'disabled' : ''}>${roleOpts(u.role)}</select></label><label class="row"><input type="checkbox" name="active" ${u.active !== false ? 'checked' : ''} ${self ? 'disabled' : ''}> Active (unchecked = cannot use the system)</label>
      <button type="button" class="btn" id="rst">Send password-reset email</button>
      <div class="row"><span class="sp"></span><button type="button" class="btn" data-close>Cancel</button><button class="btn pri">Save</button></div></form>`);
    const rst = m.$('#rst'); if (rst) rst.onclick = async () => { try { await AUTH.reset(u.email); toast('Password-reset email sent.', 'ok'); } catch (err) { toast(errMsg(err), 'bad'); } };
    onSubmit(m.$('#uf'), async f => {
      const un = u.username || normUser(f.username); if (!u.username) await checkUser(un, u.id);
      const data = { name: f.name, username: un, position: f.position, role: self ? u.role : f.role, active: self ? true : !!m.$('[name=active]').checked };
      await DB.tx(async t => {
        t.update('users', u.id, data);
        t.set('directory', un, { uid: u.id, username: un, name: data.name, position: data.position, email: u.email, active: data.active });
        audit(t, 'Update', 'users', u.id, un, `${data.position}; role ${ROLES[data.role]}; ${data.active ? 'active' : 'disabled'}`);
      });
      toast('User saved.', 'ok'); m.close();
    });
  };
}

function backupView() {
  M().innerHTML = page('Backup & Restore', 'Download a full copy of all data. Keep backups in a safe place (e.g. Google Drive).') + `<div class="card"><h3>Download backup</h3><p class="muted">Recommended: daily during the trial, then weekly.</p><div class="row"><button class="btn pri" id="bj">Download full backup (.json)</button><button class="btn" id="bx">Download as Excel (.xlsx)</button></div><p id="bs" class="muted"></p></div>
    <div class="card"><h3>Restore</h3><div class="note warn">Restore brings back all inventory data from a backup file: items, designs, suppliers, clients, POs, all documents, stock, the stock ledger, the audit log and settings. Use it only on a <b>new, empty</b> Firebase project (for example after an accident), right after <b>First-time setup</b>, not on top of live data.<br><b>User accounts are not restored.</b> Add the users again under User Accounts after the restore.</div><label class="btn dng">Choose backup file (.json)…<input type="file" accept=".json,application/json" id="rf" hidden></label></div>`;
  const dump = async () => {
    const out = {};
    for (const c of COLLECTIONS) { $('#bs').textContent = `Reading ${c}…`; out[c] = await DB.list(c); }
    $('#bs').textContent = ''; return out;
  };
  $('#bj').onclick = async () => { try { const data = await dump(); download(`BigBen_IMS_backup_${today()}.json`, JSON.stringify({ app: 'BigBen IMS', version: APP_VERSION, exportedAt: nowISO(), exportedBy: ME.email, collections: data }), 'application/json'); toast('Backup downloaded.', 'ok'); } catch (e) { toast(errMsg(e), 'bad'); } };
  $('#bx').onclick = async () => {
    if (!window.XLSX) return toast('Excel library not loaded (offline?). Use the JSON backup.', 'bad');
    try { const data = await dump(); const wb = XLSX.utils.book_new(); for (const [c, rows] of Object.entries(data)) { if (!rows.length) continue; XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.map(r => Object.fromEntries(Object.entries(r).map(([k, v]) => [k, typeof v === 'object' && v !== null ? JSON.stringify(v).slice(0, 32000) : v])))), c.slice(0, 31)); } XLSX.writeFile(wb, `BigBen_IMS_backup_${today()}.xlsx`); } catch (e) { toast(errMsg(e), 'bad'); }
  };
  $('#rf').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      let j; try { j = JSON.parse(await f.text()); } catch { fail('This file is not a valid backup (.json).'); }
      if (!j || typeof j.collections !== 'object') fail('This is not an IM Big Ben backup file.');
      // Sign-in records belong to the new project's own accounts, so they are not restored.
      const SKIP = ['users', 'directory'];
      const ops = [];
      for (const [c, rows] of Object.entries(j.collections)) {
        if (!COLLECTIONS.includes(c) || SKIP.includes(c) || !Array.isArray(rows)) continue;
        for (const r of rows) { if (!r || typeof r.id !== 'string' || !r.id || r.id.includes('/')) continue; if (c === 'settings' && r.id === 'bootstrap') continue; const { id, ...d } = r; ops.push(['set', c, id, d]); }
      }
      if (!ops.length) fail('The backup file has no inventory data.');
      if (!await confirmBox(`Restore ${ops.length} records from the backup of ${esc(fdt(j.exportedAt))}? Existing records with the same IDs will be overwritten. User accounts are not restored.`, 'Restore', true)) return;
      await DB.writeMany(ops); toast(`Restored ${ops.length} records. Add the user accounts again under User Accounts.`, 'ok');
    } catch (err) { toast(errMsg(err), 'bad'); }
  };
}

function importView() {
  M().innerHTML = page('Import & Master Data', 'Load the CPS master list, or create items and post their beginning balance from an Excel file.') + `<div class="card"><h3>CPS master list</h3><p class="muted" style="margin-top:0">Adds the 20 raw materials (MCA10001–MCA10020, with minimum stocks), 7 finished products, 3 sample mix designs and 4 clients from the company files. <b>No beginning balances are posted.</b> Items that already exist are skipped.</p><button class="btn pri" id="cps">Load CPS master list</button></div>
    <div class="card"><h3>1. Download the template</h3><p class="muted">One row per item. Opening Qty is in the <b>base unit</b>; Unit Cost is per base unit. Leave Opening Qty blank to create the item only.</p><button class="btn" id="tpl">Download template</button></div>
    <div class="card"><h3>2. Upload your file</h3><div class="row"><label class="btn pri">Choose Excel file…<input type="file" id="xf" accept=".xlsx,.xls,.csv" hidden></label><label class="f">Beginning balance date<input type="date" id="obd" value="${today()}"></label></div><div id="pv" style="margin-top:14px"></div></div>`;
  const HEAD = ['Code', 'Name', 'Type (RAW/FG)', 'Category', 'Base Unit', 'Alt Unit', 'Factor (1 alt unit = ? base)', 'Reorder Point', 'Beginning Qty (base unit)', 'Unit Cost (per base unit)'];
  $('#cps').onclick = async () => {
    if (!await confirmBox('Load the CPS items, mix designs and clients? Existing records are not changed and no stock is posted.', 'Load')) return;
    try { const r = await loadMaster(); toast(`Added ${r.items} item(s), ${r.designs} design(s), ${r.clients} client(s). ${r.skipped} already existed.`, 'ok'); }
    catch (e) { toast(errMsg(e), 'bad'); }
  };
  $('#tpl').onclick = () => {
    if (!window.XLSX) return toast('Excel library not loaded. Check your internet connection.', 'bad');
    const ws = XLSX.utils.aoa_to_sheet([HEAD, ['CEM-001', 'Portland Cement', 'RAW', 'Cement', 'kg', 'bag', 40, 2000, 8000, 6.5], ['SND-001', 'Washed Sand', 'RAW', 'Aggregates', 'cu.m.', '', '', 10, 25, 1200], ['CHB-4', 'CHB 4"', 'FG', 'CHB', 'pc', '', '', 500, 0, 0]]);
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Items'); XLSX.writeFile(wb, 'BigBen_IMS_import_template.xlsx');
  };
  $('#xf').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    if (!window.XLSX) return toast('Excel library not loaded. Check your internet connection.', 'bad');
    const wb = XLSX.read(await f.arrayBuffer()); const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, blankrows: false }).slice(1).filter(r => r.some(v => v !== '' && v != null));
    const recs = rows.map(r => {
      const [code, name, type, category, baseUnit, alt, factor, rp, oq, uc] = r.map(v => typeof v === 'string' ? v.trim() : v);
      const errs = [];
      if (!code) errs.push('code'); if (!name) errs.push('name'); if (!['RAW', 'FG'].includes(String(type || '').toUpperCase())) errs.push('type'); if (!baseUnit) errs.push('base unit');
      if (alt && !(num(factor) > 0)) errs.push('factor');
      const exists = S.items.find(i => i.code.toLowerCase() === String(code || '').toLowerCase());
      const hasStock = !!exists && ((exists.layers || []).length > 0 || Math.abs(exists.qty || 0) > EPS);
      return { hasStock, code: String(code || ''), name: String(name || ''), type: String(type || '').toUpperCase(), category: String(category || ''), baseUnit: String(baseUnit || ''), alt: String(alt || ''), factor: num(factor), rp: num(rp), oq: num(oq), uc: num(uc), errs, exists };
    });
    const ok = recs.filter(r => !r.errs.length);
    $('#pv').innerHTML = `<div class="tw"><table class="t"><thead><tr><th>Code</th><th>Name</th><th>Type</th><th>Base</th><th>Conversion</th><th class="n">Opening Qty</th><th class="n">Unit Cost</th><th>Check</th></tr></thead><tbody>${recs.map(r => `<tr><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td>${esc(r.type)}</td><td>${esc(r.baseUnit)}</td><td>${r.alt ? `1 ${esc(r.alt)} = ${fq(r.factor)}` : ''}</td><td class="n">${fq(r.oq)}</td><td class="n">${fc(r.uc)}</td><td>${r.errs.length ? `<span class="tag bad">Missing/invalid: ${r.errs.join(', ')}</span>` : r.hasStock ? (r.oq > 0 ? '<span class="tag warn">Already has stock: qty skipped</span>' : '<span class="tag">Exists: no change</span>') : r.exists ? '<span class="tag warn">Exists: beginning qty only</span>' : '<span class="tag ok">New item</span>'}</td></tr>`).join('')}</tbody></table></div>
      <div class="row" style="margin-top:12px"><span class="muted">${ok.length} of ${recs.length} rows valid.</span><span class="sp"></span><button class="btn pri" id="go" ${ok.length ? '' : 'disabled'}>Import ${ok.length} row(s)</button></div>`;
    let importing = false;
    $('#go').onclick = async () => {
      if (importing) return;
      if (!await confirmBox(`Create new items and post an opening balance dated ${fd($('#obd').value)}?`, 'Import')) return;
      importing = true; $('#go').disabled = true; $('#xf').disabled = true;
      try {
        const lines = [];
        for (const r of ok) {
          if (!r.exists && S.items.some(i => i.code.toLowerCase() === r.code.toLowerCase())) { r.exists = S.items.find(i => i.code.toLowerCase() === r.code.toLowerCase()); r.hasStock = (r.exists.layers || []).length > 0; }
          let id = r.exists?.id;
          if (!id) {
            id = DB.newId('items');
            const conversions = r.alt ? [{ unit: r.alt, factor: r.factor, effective: '2000-01-01', ts: nowISO(), by: ME.uid, byName: ME.name }] : [];
            await DB.tx(async t => { t.set('items', id, { code: r.code, name: r.name, type: r.type, category: r.category, baseUnit: r.baseUnit, reorderPoint: r.rp, conversions, qty: 0, layers: [], active: true, createdAt: nowISO(), createdBy: ME.uid }); audit(t, 'Create', 'items', id, r.code, 'Excel import'); });
          }
          if (r.oq > 0 && !r.hasStock) lines.push({ itemId: id, unit: r.exists?.baseUnit || r.baseUnit, qty: r.oq, unitCost: r.uc });
        }
        await new Promise(res => setTimeout(res, 300)); // let the item list refresh
        let msg = 'Items imported.';
        if (lines.length) { const res = await POST.OB({ date: $('#obd').value, remarks: 'Excel import', lines }); msg += ` Beginning balance ${res.docNo} posted.`; }
        toast(msg, 'ok'); location.hash = '#/stock';
      } catch (err) { toast(errMsg(err), 'bad'); } finally { importing = false; const g = $('#go'); if (g) g.disabled = false; const x = $('#xf'); if (x) x.disabled = false; }
    };
  };
}

async function auditView() {
  M().innerHTML = page('Audit Log', 'Who did what, and when. Entries cannot be edited or deleted.', '<button class="btn" id="chk">Check stock vs ledger</button>') + `<div id="chkres"></div><div class="card"><div class="bar"><label class="f" style="flex:1">Search<input id="f-q" placeholder="User, document, action…"></label><button class="btn" id="xl">Export Excel</button></div><div id="lst"><div class="loading">Loading…</div></div></div>`;
  $('#chk').onclick = async () => {
    const el = $('#chkres'); el.innerHTML = '<div class="card"><div class="loading">Reading the whole stock ledger…</div></div>';
    try {
      const led = await DB.list('ledger'); const sum = {};
      for (const l of led) sum[l.itemId] = (sum[l.itemId] || 0) + (+l.qty || 0);
      const bad = S.items.map(i => ({ i, led: r4(sum[i.id] || 0), lay: sumQty(i.layers) })).filter(x => Math.abs(x.led - (x.i.qty || 0)) > 1e-3 || Math.abs(x.lay - (x.i.qty || 0)) > 1e-3);
      el.innerHTML = `<div class="card"><h3>Stock check: ${fdt(nowISO())}</h3>${bad.length ? `<div class="note bad">${bad.length} item(s) do not match the stock ledger. This should never happen. Report it to the Administrator.</div><div class="tw"><table class="t"><thead><tr><th>Item</th><th class="n">Balance on item</th><th class="n">Sum of ledger</th><th class="n">Sum of FIFO layers</th></tr></thead><tbody>${bad.map(x => `<tr><td>${esc(x.i.code)} — ${esc(x.i.name)}</td><td class="n">${fq(x.i.qty, 4)}</td><td class="n">${fq(x.led, 4)}</td><td class="n">${fq(x.lay, 4)}</td></tr>`).join('')}</tbody></table></div>` : `<div class="note ok">All ${S.items.length} items match the stock ledger (${led.length} movements checked).</div>`}</div>`;

  };
  let rows = [];
  const seq = RSEQ;
  try { rows = await DB.list('audit', { order: ['ts', 'desc'], limit: 1000 }); if (stale(seq)) return; } catch (e) { if (stale(seq)) return; LST().innerHTML = `<div class="note bad">${esc(errMsg(e))}</div>`; return; }
  const filt = () => { const q = $('#f-q').value.toLowerCase(); return rows.filter(r => !q || [r.byName, r.action, r.docType, r.docNo, r.details].join(' ').toLowerCase().includes(q)); };
  const draw = () => { const r = filt(); LST().innerHTML = r.length ? `<div class="tw"><table class="t"><thead><tr><th>When</th><th>User</th><th>Action</th><th>Document</th><th>Details</th></tr></thead><tbody>${r.map(a => `<tr><td style="white-space:nowrap">${fdt(a.ts)}</td><td>${esc(a.byName)}<br><span class="muted">${ROLES[a.role] || ''}</span></td><td>${tag(a.action)}</td><td>${esc(DT[a.docType]?.short || a.docType)}<br><b>${esc(a.docNo)}</b></td><td>${esc(a.details)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No entries.</div>'; };

}

function pendingView() {
  const a = Q.all();
  M().innerHTML = page('Pending Sync', 'Documents saved while offline. They post automatically when the internet is back.', `<button class="btn pri" id="sync" ${navigator.onLine ? '' : 'disabled'}>Post now</button>`) + `<div class="card">${a.length ? `<div class="tw"><table class="t"><thead><tr><th>Saved</th><th>Document</th><th>Summary</th><th>Problem</th><th></th></tr></thead><tbody>${a.map(q => `<tr><td>${fdt(q.at)}</td><td>${esc(DT[q.type].short)}</td><td>${esc(qSummary(q))}</td><td>${q.error ? `<span style="color:var(--bad)">${esc(q.error)}</span>` : '<span class="muted">Waiting</span>'}</td><td class="n">${q.error ? `<button class="btn sm" data-retry="${esc(q.qid)}">Retry</button> ` : ''}<button class="btn sm dng" data-del="${esc(q.qid)}">Discard</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Nothing waiting. Everything is posted.</div>'}</div>`;
  $('#sync').onclick = async () => { await processQueue(); pendingView(); };

    if (r) { const all = Q.all(); const x = all.find(z => z.qid === r.dataset.retry); delete x.error; Q.save(all); await processQueue(); pendingView(); }
    if (d && await confirmBox('Discard this offline document? It will not be posted and must be encoded again.', 'Discard', true)) { Q.save(Q.all().filter(z => z.qid !== d.dataset.del)); pendingView(); }
  };
}

    $('#qsa').innerHTML = `<div class="qs-h">Quick select account</div><div class="qs">${act.map(d => `<button type="button" data-u="${esc(d.username)}">${avatar(d.name, d.username)}<span style="min-width:0"><b>${esc(d.name)}</b><small>${esc(d.position)}</small></span></button>`).join('')}</div>`;
    $('#qsa').onclick = e => { const b = e.target.closest('[data-u]'); if (!b) return; $$('#qsa .sel').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); $('[name=user]').value = b.dataset.u; pw.value = ''; pw.focus(); };
  }).catch(() => { const f = $('#fts'); if (f) f.hidden = false; });
  const su = $('#su'); su.onclick = e => {
    e.preventDefault();
    const m = modal('First-time setup', `<p class="muted" style="margin-top:0">Use this only once, to create the first Administrator account. Other users are added by the Administrator.</p><form id="sf" class="stack"><label class="f">Email<input type="email" name="email" required></label><label class="f">Password (min. 6)<input type="password" name="pw" required minlength="6"></label><div class="row"><span class="sp"></span><button type="button" class="btn" data-close>Cancel</button><button class="btn pri">Create account</button></div></form>`);
    onSubmit(m.$('#sf'), async f => { await AUTH.signUp(f.email, f.pw); m.close(); });
  };
}
async function noProfileView(u) {
  let boot = null; try { boot = await DB.get('settings', 'bootstrap'); } catch {}
  if (!boot) {
    $('#app').innerHTML = authPage(`<h2>Set up the first Administrator</h2><form id="bf" class="stack"><label class="f">Your full name<input name="name" required value="${esc(CPS_TEAM[0][0])}"></label><label class="f">Username (for signing in)<input name="username" required autocapitalize="none" spellcheck="false" value="${esc(CPS_TEAM[0][1])}"></label><label class="f">Position<input name="position" required value="Inventory Management Head"></label><p class="muted" style="margin:0">Signed in as ${esc(u.email)}. This account becomes the Administrator.</p><button class="lg-btn">Finish setup</button><button type="button" class="lg-btn alt" id="lo">Log out</button></form>`);
    $('#lo').onclick = () => AUTH.signOut();
    onSubmit($('#bf'), async f => {
      const un = normUser(f.username); if (!validUser(un)) fail('Username: 3–30 characters, lowercase letters, numbers, dot, dash or underscore.');
      await DB.writeMany([['set', 'users', u.uid, { name: f.name, username: un, position: f.position, email: u.email.toLowerCase(), role: 'admin', active: true, createdAt: nowISO() }], ['set', 'directory', un, { uid: u.uid, username: un, name: f.name, position: f.position, email: u.email.toLowerCase(), active: true }], ['set', 'settings', 'bootstrap', { by: u.uid, at: nowISO() }]]);
      location.reload();
    });
  } else {
    $('#app').innerHTML = authPage(`<h2>Account not activated</h2><p>Your login (${esc(u.email)}) is not yet set up in the system. Please ask the Administrator to add you under <b>User Accounts</b>.</p><button class="lg-btn alt" id="lo">Log out</button>`);
    $('#lo').onclick = () => AUTH.signOut();
  }
}

// Adds the CPS items, mix designs and clients. Skips anything that already exists. Never posts stock.
async function loadMaster() {
  const res = { items: 0, designs: 0, clients: 0, skipped: 0 };
  const ids = {}; S.items.forEach(i => ids[i.code] = i.id);
  const conv = (u, perStock) => [{ unit: u, factor: 1 / perStock, effective: '2026-01-01', ts: nowISO(), by: ME.uid, byName: ME.name }];
  const rows = [...CPS_MASTER.raw.map(r => ({ code: r[0], name: r[1], type: 'RAW', baseUnit: r[2], reorderPoint: r[3], category: r[4], conversions: r[5] ? conv(r[5][0], r[5][1]) : [] })),
    ...CPS_MASTER.fg.map(r => ({ code: r[0], name: r[1], type: 'FG', baseUnit: 'pc', reorderPoint: 0, category: 'CHB', conversions: [] }))];
  for (const r of rows) {
    if (ids[r.code]) { res.skipped++; continue; }
    ids[r.code] = await saveMaster('items', null, { ...r, qty: 0, layers: [] }, r.code); res.items++;
  }
  for (const [name, size, pcs, mats] of CPS_MASTER.designs) {
    if (S.designs.some(d => d.name === name)) { res.skipped++; continue; }
    await saveMaster('designs', null, { name, size, pcsPerCycle: pcs, fgItemId: '', materials: mats.map(([c, unit, qty]) => ({ itemId: ids[c], unit, qty })) }, name); res.designs++;
  }
  for (const name of CPS_MASTER.clients) {
    if (S.clients.some(c => c.name.toLowerCase() === name.toLowerCase())) { res.skipped++; continue; }
    await saveMaster('clients', null, { name, contact: '', phone: '', email: '', address: '', tin: '' }, name); res.clients++;
  }
  return res;
}

async function boot() {
  if (!CONFIGURED) {
    $('#app').innerHTML = authPage(`<h2>Setup needed</h2><div class="note warn">This copy of the system is not yet connected to a database.</div><p>Open <b>index.html</b> in a text editor and paste your Firebase settings into <code>FIREBASE_CONFIG</code> near the top of the file, then upload it again. See <b>SETUP.md</b>, Step 4.</p>`);
    return;
  }
  try {
    const b = await makeFirebase();
    DB = b.db; AUTH = b.au;
  } catch (e) {
    console.error(e);
    $('#app').innerHTML = authPage(`<h2>Cannot start</h2><div class="note bad">${esc(e.message || e)}</div><p class="muted">Check your internet connection and the Firebase settings at the top of index.html, then reload.</p>`);
    return;
  }
  AUTH.onChange(async u => {
    if (window.__signingOut) return;
    unsubs.forEach(f => f()); unsubs = []; ME = null;
    if (!u) return loginView();
    $('#app').innerHTML = '<div class="loading">Loading…</div>';
    let prof = null;
    try { prof = await DB.get('users', u.uid); } catch (e) { return loginView(esc(errMsg(e))); }
    if (!prof) return noProfileView(u);
    if (prof.active === false) return AUTH.signOut('Your account is disabled. Please contact the Administrator.');
    ME = { uid: u.uid, email: u.email, name: prof.name || u.email, role: prof.role, position: prof.position || '', username: prof.username || '' };
    await startWatches();
    shell(); render(); processQueue(); warmOffline(); syncPeople();
  });
}
