<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IM Big Ben — Inventory Management System</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%238e1b1b'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>BB</text></svg>">
<!-- Excel import/export library (SheetJS). If unavailable, exports fall back to CSV. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--brand:#8e1b1b;--brand-2:#a92424;--brand-l:#fbeaea;--bg:#f4f3f1;--card:#fff;--line:#e3e1dd;--txt:#1f1b18;--mut:#6f6a64;--ok:#157f3b;--okl:#e6f4ea;--warn:#9a5b00;--warnl:#fff4dc;--bad:#b42318;--badl:#fde8e6;--info:#1e4fb8;--infol:#e8effc;--r:8px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--txt);background:var(--bg)}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line)}
.topbar img{height:32px}
.topbar .brand{display:flex;flex-direction:column;line-height:1.15;border-left:1px solid var(--line);padding-left:12px;white-space:nowrap}
.topbar .brand b{font-size:15px;color:#123d36;letter-spacing:.02em}
.topbar .brand span{font-size:10.5px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.clock{display:flex;align-items:center;gap:7px;margin-left:6px;padding:6px 12px;border-radius:999px;background:#eef5f3;color:#123d36;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.topbar .sp{flex:1}
.topbar .who{font-size:12px;text-align:right;line-height:1.2;color:var(--mut)}
.topbar .who b{color:var(--txt)}
.menu-btn{display:none!important}
.layout{display:flex;min-height:calc(100vh - 56px)}
.side{width:248px;flex:none;background:#123d36;color:#e8f1ee;padding:10px 10px 30px;overflow-y:auto;position:sticky;top:56px;height:calc(100vh - 56px)}
.side .grp{margin-bottom:4px}
.side .gh{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;color:#8fb5ab;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:14px 12px 6px;cursor:pointer;text-align:left}
.side .gh:hover{color:#cfe3dd}
.side .gh .chev{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;transition:transform .15s}
.side .grp.closed .chev{transform:rotate(-90deg)}
.side .grp.closed .links{display:none}
.side a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;color:#eef5f2;text-decoration:none;font-weight:600;margin:1px 0}
.side a svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side a:hover{background:#1c4d45}
.side a.on{background:#dd9000;color:#1d1405}
.side .ver{color:#7ea59b;font-size:11px;margin:18px 12px 0}
main{flex:1;min-width:0;padding:20px 24px 60px}
h1{font-size:20px;margin:0}
.sub{color:var(--mut);margin:2px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:14px}
.bar .sp,.row .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:inherit;display:block}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mut);font-size:12px}
.kpi.alert b{color:var(--bad)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);font-weight:600}
label.f>input,label.f>select,label.f>textarea{font-weight:400;color:var(--txt);font-size:14px}
input,select,textarea{border:1px solid #cfccc7;border-radius:6px;padding:7px 9px;background:#fff;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #ecc0c0;border-color:var(--brand)}
input[type=number]{text-align:right}
input[readonly]{background:#f6f5f3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #cfccc7;background:#fff;border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--txt);font-size:14px}
.btn:hover{background:#f6f5f3}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-2)}
.btn.dng{color:var(--bad);border-color:#f0b7b1}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table.t{width:100%;border-collapse:collapse}
.t th,.t td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.t th{background:#faf9f7;font-size:12px;color:var(--mut);font-weight:600;white-space:nowrap}
.t td.n,.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t tbody tr:last-child td{border-bottom:0}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover{background:#fbf7f6}
.t input,.t select{width:100%}
.t tfoot td{font-weight:700;background:#faf9f7;border-top:1px solid var(--line)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:#eceae7;color:#4a4540;white-space:nowrap}
.tag.ok{background:var(--okl);color:var(--ok)}.tag.warn{background:var(--warnl);color:var(--warn)}.tag.bad{background:var(--badl);color:var(--bad)}.tag.info{background:var(--infol);color:var(--info)}
.empty{padding:28px;text-align:center;color:var(--mut)}
.note{padding:10px 12px;border-radius:6px;background:var(--infol);color:#173a85;margin-bottom:12px}
.note.warn{background:var(--warnl);color:#6b3f00}
.note.bad{background:var(--badl);color:#7a1a12}
.note.ok{background:var(--okl);color:#0f5a2a}
.muted{color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{border:1px solid #f1d59a;background:var(--warnl);color:#6b3f00;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.pill.on{border-color:#bfe3c9;background:var(--okl);color:var(--ok);cursor:default}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#2b2724;color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 6px 20px #0003;max-width:90vw}
.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}
.mb{position:fixed;inset:0;background:#0007;z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:32px 12px;overflow-y:auto}
.md{background:#fff;border-radius:10px;width:100%;max-width:560px;box-shadow:0 20px 50px #0004}
.md.wide{max-width:1000px}
.md>header{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.md>header h3{margin:0;flex:1;font-size:16px}
.md .bd{padding:18px}
.md>footer{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.md>footer .sp{flex:1}
.x{border:0;background:none;font-size:24px;cursor:pointer;color:var(--mut);line-height:1;padding:0 4px}
/* ---------- sign-in page ---------- */
.lg-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px;background:radial-gradient(900px 520px at 15% 0%,#1f6155 0%,transparent 62%),linear-gradient(160deg,#103a33,#08201c)}
.lg-card{width:100%;max-width:540px;background:#fff;border-radius:20px;padding:34px 38px 30px;box-shadow:0 30px 70px #0007}
.lg-logo{display:block;height:76px;margin:0 auto 12px}
.lg-name{text-align:center;font-size:27px;font-weight:800;letter-spacing:.07em;color:#123d36;line-height:1.1}
.lg-sub{text-align:center;font-size:12.5px;letter-spacing:.24em;color:#6b7c78;margin:6px 0 26px}
.lg-card h2{text-align:center;margin:0 0 14px;font-size:16px;color:#123d36}
.lg-card label.f{color:#1f2d2a;font-size:14px;font-weight:700}
.lg-card label.f>input,.pwbox input{background:#eef5f3;border:1px solid #cfdcd8;border-radius:10px;padding:12px 14px;font-size:16px;width:100%}
.lg-card label.f>input:focus,.pwbox input:focus{outline:3px solid #b9dcd3;border-color:#1b5a4f}
.pwbox{position:relative;display:block}
.pwbox input{padding-right:48px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;color:#56706a;padding:8px;line-height:0;border-radius:8px}
.eye:hover{background:#dfece8}
.eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lg-btn{width:100%;border:0;border-radius:10px;background:#1b5a4f;color:#fff;font-weight:700;font-size:16px;padding:13px;cursor:pointer;margin-top:6px}
.lg-btn:hover{background:#154a41}
.lg-btn:disabled{opacity:.6;cursor:wait}
.lg-btn.alt{background:#fff;color:#123d36;border:1px solid #cfdcd8}
.lg-help{text-align:center;color:#66736f;font-size:13px;margin:16px 0 0}
.qs-h{display:flex;align-items:center;gap:12px;color:#6b7c78;font-size:12px;letter-spacing:.16em;margin:24px 0 12px;text-transform:uppercase}
.qs-h:before,.qs-h:after{content:"";flex:1;height:1px;background:#dfe6e4}
.qs{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-height:340px;overflow-y:auto;padding:2px}
.qs button{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid #dfe6e4;background:#f5f8f7;border-radius:12px;padding:10px 12px;cursor:pointer;min-width:0}
.qs button:hover{border-color:#9cc3b9;background:#eef6f3}
.qs button.sel{border-color:#dd9000;background:#fff7e6;box-shadow:0 0 0 2px #f6d48f}
.qs b{display:block;font-size:14px;color:#1f2d2a;line-height:1.2}
.qs small{display:block;color:#6b7c78;font-size:12px;line-height:1.25;margin-top:2px}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;letter-spacing:.02em}
.lg-foot{color:#9fc0b8;font-size:12px;margin-top:18px;text-align:center}
@media (max-width:520px){.lg-card{padding:26px 18px 22px}.qs{grid-template-columns:1fr}.lg-name{font-size:24px}}
.stack{display:flex;flex-direction:column;gap:12px}
.loading{padding:40px;text-align:center;color:var(--mut)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 16px;margin-bottom:12px}
.kv div span{display:block;font-size:12px;color:var(--mut)}
.preview{background:#e8e6e3;padding:16px;overflow:auto;border-radius:6px}
.preview .paper{box-shadow:0 2px 12px #0002;padding:.45in}
/* ---------- printed forms (Letter) ---------- */
#print-root{display:none}
.paper{background:#fff;color:#000;font:10pt/1.35 Arial,Helvetica,sans-serif;width:8.5in;max-width:100%;margin:0 auto;position:relative}
.paper .ph{display:flex;align-items:center;gap:12px;border-bottom:2px solid #000;padding-bottom:8px}
.paper .ph img{height:52px}
.paper .co{flex:1}.paper .co b{font-size:12.5pt;display:block}.paper .co small{font-size:8.5pt}
.paper table.fc{font-size:8pt;border-collapse:collapse}.paper .fc td{border:1px solid #000;padding:2px 6px;min-width:70px}
.paper h2{text-align:center;font-size:13.5pt;margin:10px 0 2px;letter-spacing:.05em;text-transform:uppercase}
.paper .dno{text-align:center;font-size:10.5pt;margin-bottom:10px}
.paper .meta{display:grid;grid-template-columns:1fr 1fr;gap:3px 24px;margin-bottom:10px}
.paper .meta div{display:flex;gap:6px;border-bottom:1px solid #999;padding:2px 0;min-height:20px}
.paper .meta span{min-width:112px;font-weight:bold}
.paper table.pt{width:100%;border-collapse:collapse}
.paper .pt th,.paper .pt td{border:1px solid #000;padding:3px 5px;vertical-align:top}
.paper .pt th{background:#e9e9e9;font-size:9pt}
.paper .pt td.n,.paper .pt th.n{text-align:right;white-space:nowrap}
.paper .pt tfoot td{font-weight:bold}
.paper .rem{margin-top:8px;border:1px solid #000;padding:4px 6px;min-height:36px}
.paper .sig{display:grid;gap:22px;margin-top:30px}
.paper .sig .lb{font-size:9pt}
.paper .sig .ln{border-bottom:1px solid #000;margin-top:26px;text-align:center;font-weight:bold;min-height:16px}
.paper .sig .rl{text-align:center;font-size:8.5pt}
.paper .foot{margin-top:16px;font-size:7.5pt;color:#333;display:flex;justify-content:space-between;gap:12px;border-top:1px solid #999;padding-top:3px}
.paper .void{position:absolute;top:35%;left:0;right:0;text-align:center;font-size:80pt;color:rgba(200,0,0,.2);transform:rotate(-18deg);font-weight:bold;pointer-events:none}
.paper.land{width:11in}
.paper .cfh{display:flex;align-items:center;gap:14px;padding-bottom:6px}
.paper .cfh img{height:46px}
.paper .cft{flex:1;text-align:center;display:flex;flex-direction:column;line-height:1.25}
.paper .cft b{font-size:13pt;letter-spacing:.03em}
.paper .cft span{font-size:8.5pt}
.paper .cfr{min-width:150px;text-align:right;font-size:9pt}
.paper .cfw{font-weight:bold;font-size:10.5pt;margin:4px 0 6px}
.paper table.rlt{font-size:8.5pt}
.paper .rlt th{background:#dfe7ee;font-size:8pt;text-align:center}
.paper .rlt td{height:22px}
.paper td.c{text-align:center}
.paper .cfs{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:34px;font-size:9pt}
.paper .cfs .ln{border-bottom:1px solid #000;text-align:center;font-weight:bold;min-height:18px}
.paper .cfs .rl{text-align:center;font-size:8.5pt}
.paper .wsh{display:flex;align-items:center;justify-content:center;gap:26px;margin-bottom:12px}
.paper .wsh img{height:50px}
.paper .wsh div{display:flex;flex-direction:column;align-items:center;line-height:1.2}
.paper .wsh b{font-size:15pt;letter-spacing:.02em}
.paper .wsh span{font-size:8.5pt}
.paper .wsm{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;margin-bottom:10px}
.paper .wf{display:flex;align-items:flex-end;gap:6px;margin-bottom:5px;font-size:9.5pt}
.paper .wf span{font-weight:bold;white-space:nowrap}
.paper .wf em{font-style:normal;flex:1;border-bottom:1px solid #000;padding:0 4px 1px;min-height:16px}
.paper .wf .red{color:#c0262d;font:bold 15pt "Courier New",Courier,monospace;letter-spacing:.04em}
.paper table.wst td{height:21px}
.paper table.wst th{text-align:center;font-size:10pt}
.paper .wsf{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:26px;margin-top:14px}
.wsx2 .paper{height:5.05in;overflow:hidden;page-break-inside:avoid}
.wsx2 .cut{border-top:1px dashed #888;margin:.07in 0}
.wsx2 .paper .wsh{margin-bottom:6px}.wsx2 .paper .wsh img{height:40px}.wsx2 .paper .wsh b{font-size:13pt}
.wsx2 .paper .wsm{margin-bottom:6px}.wsx2 .paper .wf{margin-bottom:3px;font-size:8.5pt}.wsx2 .paper .wf .red{font-size:13pt}
.wsx2 .paper table.wst{font-size:8.5pt}.wsx2 .paper table.wst td{height:15px;padding:1px 5px}.wsx2 .paper table.wst th{font-size:8.5pt;padding:2px 5px}
.wsx2 .paper .wsf{margin-top:8px;gap:18px}.wsx2 .paper .foot{margin-top:6px;padding-top:2px}
.wsx2 .paper .void{font-size:56pt;top:30%}
@media print{
  body{background:#fff}
  body.printing>*:not(#print-root){display:none!important}
  body.printing #print-root{display:block}
  .paper{width:auto}
  .paper .pt tr{page-break-inside:avoid}
}
@media (max-width:900px){
  .menu-btn{display:inline-flex!important}
  .side{position:fixed;left:0;top:56px;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 20px #0002}
  body.nav-open .side{transform:none}
  main{padding:16px}
  .topbar .brand,.topbar .who{display:none}
  .clock{margin-left:0;padding:5px 8px;font-size:12px;min-width:0;overflow:hidden}
  .clock svg{display:none}
  #lo{padding:3px 6px}
  .topbar{gap:8px;padding:0 10px}
  .topbar img{height:26px}
  #pw{display:none!important}
  .side .mob{display:block}
}
.side .mob{display:none}
</style>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>
<div id="print-root"></div>
<div id="toast"></div>

<script type="module">
/* =====================================================================
   BIG BEN BUILDERS — INVENTORY MANAGEMENT SYSTEM (single-file web app)
   ---------------------------------------------------------------------
   1) Create a Firebase project, enable Email/Password sign-in and
      Cloud Firestore, then paste your web app config below.
   2) Until the config is filled in, the app shows a "setup needed" page.
   See SETUP.md for the full step-by-step guide.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE_PROJECT_ID.firebaseapp.com",
  projectId: "PASTE_PROJECT_ID",
  storageBucket: "PASTE_PROJECT_ID.appspot.com",
  messagingSenderId: "PASTE_SENDER_ID",
  appId: "PASTE_APP_ID"
};
const FIREBASE_SDK_VERSION = '10.12.2';
const APP_VERSION = '1.5.0';
const APP_NAME = 'IM Big Ben', APP_SUB = 'Inventory Management System';

async function makeFirebase() {
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}/`;
  const [A, AU, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = A.initializeApp(FIREBASE_CONFIG);
  const auth = AU.getAuth(app);
  // Developer testing only: http://localhost/...?emulator=1 connects to local Firebase emulators.
  const EMU = ['localhost', '127.0.0.1'].includes(location.hostname) && new URLSearchParams(location.search).has('emulator');
  if (EMU) AU.connectAuthEmulator(auth, 'http://127.0.0.1:9099', { disableWarnings: true });
  await AU.setPersistence(auth, AU.browserLocalPersistence);
  let fs;
  try { fs = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
  catch (e) { console.warn('Offline cache unavailable', e); fs = F.getFirestore(app); }
  if (EMU) F.connectFirestoreEmulator(fs, '127.0.0.1', 8080);
  const strip = d => d.exists() ? { ...d.data(), id: d.id } : null;
  const ref = (c, i) => F.doc(fs, c, i);
  const db = {
    newId: c => F.doc(F.collection(fs, c)).id,
    async get(c, i) { return strip(await F.getDoc(ref(c, i))); },
    async list(c, o = {}) {
      const q = [];
      for (const w of o.where || []) q.push(F.where(...w));
      if (o.order) q.push(F.orderBy(o.order[0], o.order[1] || 'asc'));
      if (o.limit) q.push(F.limit(o.limit));
      const s = await F.getDocs(F.query(F.collection(fs, c), ...q));
      return s.docs.map(strip);
    },
    watch(c, cb, err) { return F.onSnapshot(F.collection(fs, c), s => cb(s.docs.map(strip)), e => { console.error(c, e); err && err(e); }); },
    async set(c, i, d) { await F.setDoc(ref(c, i), clean(d)); },
    async update(c, i, d) { await F.updateDoc(ref(c, i), clean(d)); },
    async tx(fn) {
      return F.runTransaction(fs, async t => {
        const w = [];
        const r = await fn({ get: async (c, i) => strip(await t.get(ref(c, i))), set: (c, i, d) => w.push(['set', c, i, d]), update: (c, i, d) => w.push(['update', c, i, d]), del: (c, i) => w.push(['del', c, i]) });
        for (const [op, c, i, d] of w) { const rf = ref(c, i); if (op === 'set') t.set(rf, clean(d)); else if (op === 'update') t.update(rf, clean(d)); else t.delete(rf); }
        return r;
      });
    },
    async writeMany(ops) {
      for (let i = 0; i < ops.length; i += 200) {
        const b = F.writeBatch(fs);
        for (const [op, c, id, d] of ops.slice(i, i + 200)) op === 'set' ? b.set(ref(c, id), clean(d)) : b.delete(ref(c, id));
        await b.commit();
      }
    },
    collections: () => COLLECTIONS
  };
  const au = {
    onChange: cb => AU.onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, email: u.email } : null)),
    signIn: (e, p) => AU.signInWithEmailAndPassword(auth, e.trim(), p),
    signUp: (e, p) => AU.createUserWithEmailAndPassword(auth, e.trim(), p),
    async signOut(msg) {
      if (msg) try { sessionStorage.setItem('bigben_ims_flash', msg); } catch {}
      window.__signingOut = true;            // the page reloads; don't redraw the sign-in screen first
      $('#app').innerHTML = '<div class="loading">Signing out…</div>';
      await AU.signOut(auth);
      try { await F.terminate(fs); await F.clearIndexedDbPersistence(fs); } catch (e) { console.warn('Could not clear offline cache', e); }
      location.reload();
    },
    reset: e => AU.sendPasswordResetEmail(auth, e.trim()),
    async createUser(e, p) {
      // A second Firebase app instance lets the admin create accounts without being signed out.
      const sec = A.getApps().find(a => a.name === 'secondary') || A.initializeApp(FIREBASE_CONFIG, 'secondary');
      const sa = AU.getAuth(sec);
      if (EMU && !sa.emulatorConfig) AU.connectAuthEmulator(sa, 'http://127.0.0.1:9099', { disableWarnings: true });
      const c = await AU.createUserWithEmailAndPassword(sa, e.trim(), p);
      await AU.signOut(sa); return c.user.uid;
    },
    async changePassword(o, n) {
      const u = auth.currentUser;
      await AU.reauthenticateWithCredential(u, AU.EmailAuthProvider.credential(u.email, o));
      await AU.updatePassword(u, n);
    }
  };
  return { db, au };
}

const COLLECTIONS = ['users', 'directory', 'public', 'settings', 'items', 'suppliers', 'clients', 'designs', 'supplierPOs', 'receivings', 'batches', 'consumptions', 'outputs', 'recrushes', 'clientPOs', 'withdrawals', 'openings', 'ledger', 'audit', 'counters', 'poIndex', 'cpoIndex', 'drIndex'];

/* ---------------- state & roles ---------------- */
let DB, AUTH, ME = null;
const S = { items: [], suppliers: [], clients: [], designs: [], users: [], company: { ...DEFAULT_COMPANY } };
const item = id => S.items.find(i => i.id === id);
const ROLES = { admin: 'Administrator', depthead: 'Department Head', opshead: 'Operations Head', staff: 'Warehouse Staff', auditor: 'Auditor' };
const has = (...r) => !!ME && r.includes(ME.role);
const can = {
  encode: () => has('admin', 'depthead', 'opshead', 'staff'),
  po: () => has('admin', 'depthead', 'staff'),
  master: () => has('admin', 'depthead'),
  void: () => has('admin', 'depthead'),
  batch: () => has('admin', 'depthead', 'opshead'),
  audit: () => has('admin', 'depthead', 'auditor'),
  admin: () => has('admin')
};

/* ---------------- document types ---------------- */
const DT = {
  PO: { col: 'supplierPOs', title: 'Purchase Order', short: 'Supplier PO' },
  RL: { col: 'receivings', title: 'Receiving Log', short: 'Receiving Log' },
  PB: { col: 'batches', title: 'Production Batch Summary', short: 'Production Batch' },
  MCS: { col: 'consumptions', title: 'Material Consumption Slip', short: 'Material Consumption' },
  OUT: { col: 'outputs', title: 'Production Output Report', short: 'Production Output' },
  RC: { col: 'recrushes', title: 'Recrushing Log', short: 'Recrushing Log' },
  CPO: { col: 'clientPOs', title: 'Client Purchase Order', short: 'Client PO' },
  WS: { col: 'withdrawals', title: 'Withdrawal Slip — Finished Goods', short: 'Withdrawal Slip' },
  OB: { col: 'openings', title: 'Beginning Balance', short: 'Beginning Balance' },
  UT: { col: null, title: 'Inventory Status Report', short: 'Utilization Report' }
};
const QUEUEABLE = ['PO', 'RL', 'MCS', 'OUT', 'CPO', 'WS', 'RC'];

/* ---------------- units & FIFO helpers ---------------- */
const layerSort = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0);
const sumQty = layers => r4((layers || []).reduce((s, l) => s + l.rem, 0));
const stockValue = it => r2((it?.layers || []).reduce((s, l) => s + l.rem * l.cost, 0));
const unitsOf = it => it ? [it.baseUnit, ...new Set((it.conversions || []).map(c => c.unit))] : [];
const altUnit = it => (it?.conversions || [])[0]?.unit || '';
function factorOf(it, unit, date) {
  if (!unit || unit === it.baseUnit) return 1;
  const cs = (it.conversions || []).filter(c => c.unit === unit);
  if (!cs.length) fail(`${it.name}: no conversion factor set for "${unit}". Set it in Items & Units (e.g. 1 ${it.baseUnit} = ___ ${unit}).`);
  const sorted = cs.slice().sort((a, b) => (a.effective + a.ts) < (b.effective + b.ts) ? 1 : -1);
  return (sorted.find(c => c.effective <= (date || today())) || sorted[sorted.length - 1]).factor;
}
// Conversions are stored as "1 <unit> = factor <base unit>"; shown in whichever direction reads naturally.
const convPhrase = (unit, f, base) => f >= 1 ? `1 ${unit} = ${fq(f, 4)} ${base}` : `1 ${base} = ${fq(1 / f, 4)} ${unit}`;
function convText(it, date) {
  return [...new Set((it?.conversions || []).map(c => c.unit))].map(u => convPhrase(u, factorOf(it, u, date), it.baseUnit)).join(', ');
}

/* ---------------- posting engine (all stock changes go through here) ---------------- */
const stamp = () => ({ by: ME.uid, byName: ME.name, ts: nowISO() });
// Document dates must be real dates and not in the future (a typo like 2027 would hide the document from the lists).
function checkDate(d, label = 'Date') {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(d || '')) || isNaN(new Date(d + 'T00:00:00Z')) || new Date(d + 'T00:00:00Z').toISOString().slice(0, 10) !== d) fail(`${label} is missing or invalid.`);
  if (d > ymd(new Date(Date.now() + 864e5))) fail(`${label} ${fd(d)} is in the future. Check the date.`);
  if (d < '2020-01-01') fail(`${label} ${fd(d)} is too far in the past. Check the date.`);
}
async function loadItems(t, ids) {
  const m = {};
  for (const id of [...new Set(ids)]) {
    const d = await t.get('items', id);
    if (!d) fail('Item not found. Refresh and try again.');
    m[id] = { ...d, layers: (d.layers || []).map(l => ({ ...l })) };
  }
  return m;
}
function saveItems(t, m) {
  for (const it of Object.values(m)) if (it._dirty) t.update('items', it.id, { qty: sumQty(it.layers), layers: it.layers, ...(it._extra || {}), updatedAt: nowISO() });
}
function ledger(t, it, e) {
  t.set('ledger', DB.newId('ledger'), { itemId: it.id, itemCode: it.code, itemName: it.name, itemType: it.type, baseUnit: it.baseUnit, balAfter: sumQty(it.layers), cost: 0, value: 0, party: '', ref: '', ...e, by: ME.uid, byName: ME.name, ts: nowISO() });
}
function audit(t, action, docType, docId, docNo, details = '') {
  t.set('audit', DB.newId('audit'), { action, docType, docId, docNo, details, by: ME.uid, byName: ME.name, role: ME.role, ts: nowISO() });
}
async function nextNo(t, prefix, date) {
  const y = (date || today()).slice(0, 4), id = `${prefix}-${y}`;
  const c = await t.get('counters', id); const n = (c?.n || 0) + 1;
  t.set('counters', id, { n });
  return `${prefix}-${y}-${String(n).padStart(4, '0')}`;
}
function addLayer(it, { lid, date, qty, cost, src, srcId, batchId }) {
  if (qty <= EPS) return;
  it.layers.push({ lid, date, ts: nowISO(), qty: r4(qty), rem: r4(qty), cost: r6(cost), src, srcId, batchId: batchId || null });
  it.layers.sort(layerSort); it._dirty = true;
}
function takeFifo(it, qty, date) {
  const have = sumQty(it.layers);
  if (qty > have + EPS) fail(`Not enough stock for ${it.name}: on hand ${fq(have)} ${it.baseUnit}, needed ${fq(qty)} ${it.baseUnit}.`);
  // Stock received after the document date cannot be used by it.
  const asOf = r4(it.layers.filter(l => !date || l.date <= date).reduce((a, l) => a + l.rem, 0));
  if (qty > asOf + EPS) fail(`Not enough stock for ${it.name} as of ${fd(date)}: only ${fq(asOf)} ${it.baseUnit} was available on that date (the rest arrived later). Check the date.`);
  let need = r4(qty), cost = 0; const take = [];
  it.layers.sort(layerSort);
  for (const l of it.layers) {
    if (need <= EPS) break;
    if (l.rem <= EPS || (date && l.date > date)) continue;
    const q = r4(Math.min(l.rem, need));
    l.rem = r4(l.rem - q); need = r4(need - q); cost += q * l.cost;
    take.push({ lid: l.lid, date: l.date, ts: l.ts, qty: q, cost: l.cost, src: l.src, srcId: l.srcId, batchId: l.batchId || null });
  }
  it.layers = it.layers.filter(l => l.rem > EPS); it._dirty = true;
  return { take, cost: r2(cost) };
}
function restoreTakes(it, take) {
  for (const k of take) {
    const l = it.layers.find(x => x.lid === k.lid);
    if (l) l.rem = r4(l.rem + k.qty);
    else it.layers.push({ lid: k.lid, date: k.date, ts: k.ts, qty: k.qty, rem: k.qty, cost: k.cost, src: k.src, srcId: k.srcId, batchId: k.batchId || null });
  }
  it.layers.sort(layerSort); it._dirty = true;
}
function removeLayer(it, lid, expect) {
  const l = it.layers.find(x => x.lid === lid);
  if (!l || Math.abs(l.rem - expect) > EPS) fail(`Cannot void: stock of ${it.name} from this document has already been used. Void the later documents that used it first.`);
  it.layers = it.layers.filter(x => x !== l); it._dirty = true; return l;
}
// Each posting carries an id made on the device (p._id). If that document already exists, the posting is a repeat.
async function claimId(t, col, p) {
  const id = typeof p._id === 'string' && /^[A-Za-z0-9]{10,40}$/.test(p._id) ? p._id : DB.newId(col);
  const ex = p._id ? await t.get(col, id) : null;
  return { id, existing: ex };
}
// Item, unit and price of each PO line as saved when the PO was created (cannot be changed by encoders).
const lockOf = (po, i) => ({ ...po.lines[i], ...((po.lock || [])[i] || {}) });
const poStatus = (lines, f) => lines.every(l => (l[f] || 0) <= EPS) ? 'Open' : lines.every(l => (l[f] || 0) >= l.qty - EPS) ? 'Completed' : 'Partial';

const POST = {
  async PO(p) {
    checkDate(p.date);
    if (!String(p.poNo || '').trim()) fail('PO No. is required.');
    if (!p.supplierId) fail('Select a supplier.');
    const lines = (p.lines || []).filter(l => l.itemId && num(l.qty) > 0);
    if (!lines.length) fail('Add at least one item with a quantity.');
    return DB.tx(async t => {
      const c = await claimId(t, 'supplierPOs', p); if (c.existing) return { id: c.id, docNo: c.existing.docNo, already: true };
      const key = norm(p.poNo);
      if (await t.get('poIndex', key)) fail(`PO No. ${p.poNo} already exists.`);
      const sup = await t.get('suppliers', p.supplierId);
      const its = await loadItems(t, lines.map(l => l.itemId));
      const id = c.id;
      const L = lines.map(l => { const it = its[l.itemId]; const unit = l.unit || it.baseUnit; return { itemId: it.id, itemCode: it.code, itemName: it.name, baseUnit: it.baseUnit, unit, qty: r4(num(l.qty)), price: r4(num(l.price)), amount: r2(num(l.qty) * num(l.price)), received: 0 }; });
      const doc = { docNo: p.poNo.trim(), poNo: p.poNo.trim(), poKey: key, supplierId: p.supplierId, supplierName: sup?.name || '', date: p.date || today(), deliveryDate: p.deliveryDate || '', terms: p.terms || '', remarks: p.remarks || '', lines: L, lock: L.map(l => ({ itemId: l.itemId, unit: l.unit, price: l.price })), total: r2(L.reduce((s, l) => s + l.amount, 0)), status: 'Open', queuedAt: p._queuedAt || null, ...stamp() };
      t.set('poIndex', key, { ref: id, col: 'supplierPOs' });
      t.set('supplierPOs', id, doc);
      audit(t, 'Create', 'PO', id, doc.docNo, `${doc.supplierName}; ${L.length} line(s); ${fp(doc.total)}`);
      return { id, docNo: doc.docNo };
    });
  },

  async RL(p) {
    checkDate(p.date);
    if (!p.poId) fail('Load a PO first.');
    const lines = (p.lines || []).filter(l => num(l.qty) > 0 || num(l.rejected) > 0);
    if (!lines.length) fail('Enter the accepted or rejected quantity for at least one item.');
    if (lines.some(l => num(l.qty) < 0 || num(l.rejected) < 0)) fail('Quantities cannot be negative.');
    return DB.tx(async t => {
      const c = await claimId(t, 'receivings', p); if (c.existing) return { id: c.id, docNo: c.existing.docNo, already: true };
      const po = await t.get('supplierPOs', p.poId);
      if (!po) fail('PO not found.');
      if (!['Open', 'Partial'].includes(po.status)) fail(`PO ${po.poNo} is already ${po.status}.`);
      const its = await loadItems(t, lines.map(l => lockOf(po, l.idx).itemId));
      const docNo = await nextNo(t, 'RL', p.date); const id = c.id;
      const out = [];
      for (const l of lines) {
        const pl = po.lines[l.idx]; const q = r4(num(l.qty)); const remain = r4(pl.qty - (pl.received || 0));
        if (q > remain + EPS) fail(`${pl.itemName}: receiving ${fq(q)} ${pl.unit} but only ${fq(remain)} ${pl.unit} remains on PO ${po.poNo}.`);
        const pk = lockOf(po, l.idx);
        const it = its[pk.itemId]; const f = factorOf(it, pk.unit, p.date); const base = r4(q * f); const cost = r6(pk.price / f); const lid = `${id}_${l.idx}`;
        const rej = r4(num(l.rejected));
        const action = q > EPS && rej <= EPS ? 'Accepted' : q <= EPS ? 'Rejected' : 'Partial Acceptance';
        if (base > EPS) {
          addLayer(it, { lid, date: p.date, qty: base, cost, src: docNo, srcId: id });
          ledger(t, it, { date: p.date, type: 'IN', docType: 'RL', docId: id, docNo, qty: base, cost, value: r2(base * cost), party: po.supplierName, ref: 'PO ' + po.poNo });
        }
        pl.received = r4((pl.received || 0) + q);   // rejected quantity is not received against the PO
        out.push({ idx: l.idx, itemId: it.id, itemCode: it.code, itemName: it.name, unit: pk.unit, qty: q, rejected: rej, action, remark: String(l.remark || '').trim(), factor: f, baseQty: base, baseUnit: it.baseUnit, price: pk.price, cost, value: r2(base * cost), lid });
      }
      const status = poStatus(po.lines, 'received');
      t.update('supplierPOs', po.id, { lines: po.lines, status });
      const doc = { docNo, date: p.date, poId: po.id, poNo: po.poNo, supplierId: po.supplierId, supplierName: po.supplierName, supplierDR: p.supplierDR || '', invoiceNo: p.invoiceNo || '', plateNo: p.plateNo || '', receivedBy: p.receivedBy || ME.name, inspectedBy: p.inspectedBy || '', remarks: p.remarks || '', lines: out, total: r2(out.reduce((s, l) => s + l.value, 0)), status: 'Posted', queuedAt: p._queuedAt || null, ...stamp() };
      t.set('receivings', id, doc); saveItems(t, its);
      audit(t, 'Post', 'RL', id, docNo, `PO ${po.poNo}; ${out.length} line(s); PO now ${status}`);
      return { id, docNo };
    });
  },

  async PB(p) {
    checkDate(p.date);
    if (!p.designId) fail('Select a mix design.');
    if (!p.fgItemId) fail('Select the CHB product to be produced.');
    return DB.tx(async t => {
      const c = await claimId(t, 'batches', p); if (c.existing) return { id: c.id, docNo: c.existing.docNo, already: true };
      const ds = await t.get('designs', p.designId); if (!ds) fail('Design not found.');
      const fg = await t.get('items', p.fgItemId); if (!fg || fg.type !== 'FG') fail('Select a finished-good product.');
      const docNo = await nextNo(t, 'PB', p.date); const id = c.id;
      t.set('batches', id, { docNo, date: p.date, startDate: p.date, designId: ds.id, designName: ds.name, fgItemId: fg.id, fgItemName: fg.name, fgCode: fg.code, plannedQty: num(p.plannedQty), remarks: p.remarks || '', status: 'Open', materialCost: 0, goodQty: 0, rejectQty: 0, fgValue: 0, cycles: 0, targetPcs: 0, ...stamp() });
      audit(t, 'Create', 'PB', id, docNo, `${fg.name}; mix ${ds.name}; planned ${fq(num(p.plannedQty))} pcs`);
      return { id, docNo };
    });
  },

  async MCS(p) {
    checkDate(p.date);
    if (!p.batchId) fail('Select a production batch.');
    const lines = (p.lines || []).filter(l => l.itemId && num(l.qty) > 0);
    if (!lines.length) fail('Add at least one material with a quantity.');
    return DB.tx(async t => {
      const c = await claimId(t, 'consumptions', p); if (c.existing) return { id: c.id, docNo: c.existing.docNo, already: true };
      const b = await t.get('batches', p.batchId); if (!b) fail('Batch not found.');
      if (b.status !== 'Open') fail(`Batch ${b.docNo} is already closed.`);
      const its = await loadItems(t, lines.map(l => l.itemId));
      const docNo = await nextNo(t, 'MCS', p.date); const id = c.id;
      const out = []; let total = 0;
      for (const l of lines) {
        const it = its[l.itemId]; if (it.type !== 'RAW') fail(`${it.name} is not a raw material.`);
        const unit = l.unit || it.baseUnit; const f = factorOf(it, unit, p.date); const q = r4(num(l.qty)); const base = r4(q * f);
        const { take, cost } = takeFifo(it, base, p.date); total += cost;
        out.push({ itemId: it.id, itemCode: it.code, itemName: it.name, unit, qty: q, factor: f, baseQty: base, baseUnit: it.baseUnit, value: cost, cost: base ? r6(cost / base) : 0, take });
        ledger(t, it, { date: p.date, type: 'OUT', docType: 'MCS', docId: id, docNo, qty: -base, cost: base ? r6(cost / base) : 0, value: -cost, party: 'Production', ref: `Batch ${b.docNo} (${b.designName})` });
      }
      total = r2(total);
      const cycles = r4(num(p.cycles)), targetPcs = r4(num(p.targetPcs));
      const target = (p.target || []).filter(x => x.itemId && num(x.qty) > 0).map(x => ({ itemId: x.itemId, unit: x.unit, qty: r4(num(x.qty)) }));
      t.update('batches', b.id, { materialCost: r2((b.materialCost || 0) + total), cycles: r4((b.cycles || 0) + cycles), targetPcs: r4((b.targetPcs || 0) + targetPcs) });
      t.set('consumptions', id, { docNo, date: p.date, batchId: b.id, batchNo: b.docNo, productName: b.fgItemName, designId: p.designId || b.designId, designName: p.designName || b.designName, cycles, targetPcs, target, shift: p.shift || '', remarks: p.remarks || '', lines: out, total, status: 'Posted', queuedAt: p._queuedAt || null, ...stamp() });
      saveItems(t, its);
      audit(t, 'Post', 'MCS', id, docNo, `Batch ${b.docNo}; ${out.length} line(s); ${fp(total)}`);
      return { id, docNo };
    });
  },

  async OUT(p) {
    checkDate(p.date);
    const good = r4(num(p.good)), reject = r4(num(p.reject));
    if (!p.batchId) fail('Select a production batch.');
    if (good < 0 || reject < 0) fail('Quantities cannot be negative.');
    if (good + reject <= 0) fail('Enter the good and/or reject quantity.');
    return DB.tx(async t => {
      const c = await claimId(t, 'outputs', p); if (c.existing) return { id: c.id, docNo: c.existing.docNo, already: true };
      const b = await t.get('batches', p.batchId); if (!b) fail('Batch not found.');
      if (b.status !== 'Open') fail(`Batch ${b.docNo} is already closed.`);
      const its = await loadItems(t, [b.fgItemId]); const fg = its[b.fgItemId];
      const docNo = await nextNo(t, 'OUT', p.date); const id = c.id;
      const newGood = r4((b.goodQty || 0) + good);

  async CLOSE(p) {

      }

  async WS(p) {
    checkDate(p.date);

    const lines = (p.lines || []).filter(l => num(l.qty) > 0);

    return DB.tx(async t => {
      const c = await claimId(t, 'withdrawals', p); if (c.existing) return { id: c.id, docNo: c.existing.docNo, already: true };
      const po = await t.get('clientPOs', p.cpoId); if (!po) fail('Client PO not found.');

        ledger(t, it, { date: p.date, type: 'OUT', docType: 'WS', docId: id, docNo, qty: -q, cost: q ? r6(cost / q) : 0, value: -cost, party: po.clientName, ref: `WS ${wsNoText(p.wsFormNo)}${drNo ? ' / DR ' + drNo : ''} / PO ${po.poNo}` });
      }

      saveItems(t, its);

  async RC(p) {

      const c = await claimId(t, 'recrushes', p); if (c.existing) return { id: c.id, docNo: c.existing.docNo, already: true };

};

async function voidDoc(type, id, reason) {
  if (!can.void()) fail('Only the Administrator or Department Head can void documents.');
  if (!String(reason || '').trim()) fail('A reason is required.');
  const col = DT[type].col;
  return DB.tx(async t => {
    const d = await t.get(col, id); if (!d) fail('Document not found.');
    if (d.status !== 'Posted') fail('Only posted documents can be voided.');
    const date = today(); const why = 'VOID: ' + reason.trim();
    if (type === 'RL' || type === 'OB') {
      const po = type === 'RL' ? await t.get('supplierPOs', d.poId) : null;
      const its = await loadItems(t, d.lines.map(l => l.itemId));
      for (const l of d.lines) {
        const it = its[l.itemId];
        if (l.baseQty > EPS) {   // a fully rejected line put nothing into stock
          removeLayer(it, l.lid, l.baseQty);
          ledger(t, it, { date, type: 'VOID', docType: type, docId: id, docNo: d.docNo, qty: -l.baseQty, cost: l.cost, value: -l.value, party: d.supplierName || 'Opening balance', ref: why });
        }
        if (po) po.lines[l.idx].received = r4((po.lines[l.idx].received || 0) - l.qty);
      }
      if (po) t.update('supplierPOs', po.id, { lines: po.lines, status: ['Closed', 'Cancelled'].includes(po.status) ? po.status : poStatus(po.lines, 'received') });
      saveItems(t, its);
    } else if (type === 'MCS') {
      const b = await t.get('batches', d.batchId); if (!b) fail('Batch not found.');
      if (b.status !== 'Open') fail(`Batch ${b.docNo} is closed; its consumption can no longer be voided.`);
      const its = await loadItems(t, d.lines.map(l => l.itemId));
      for (const l of d.lines) { const it = its[l.itemId]; restoreTakes(it, l.take); ledger(t, it, { date, type: 'VOID', docType: type, docId: id, docNo: d.docNo, qty: l.baseQty, cost: l.cost, value: l.value, party: 'Production', ref: why }); }
      t.update('batches', b.id, { materialCost: r2((b.materialCost || 0) - d.total), cycles: r4((b.cycles || 0) - (d.cycles || 0)), targetPcs: r4((b.targetPcs || 0) - (d.targetPcs || 0)) });
      saveItems(t, its);
    } else if (type === 'OUT') {
      const b = await t.get('batches', d.batchId); if (!b) fail('Batch not found.');
      if (b.status !== 'Open') fail(`Batch ${b.docNo} is closed; its output can no longer be voided.`);
      const its = await loadItems(t, [d.itemId]); const fg = its[d.itemId];
      if (d.reject > 0 && (fg.rejectBal || 0) + EPS < d.reject) fail('Rejects from this output were already recrushed. Void the recrushing log first.');
      let val = 0;
      if (d.good > 0) { const l = removeLayer(fg, d.lid, d.good); val = r2(d.good * l.cost); ledger(t, fg, { date, type: 'VOID', docType: type, docId: id, docNo: d.docNo, qty: -d.good, cost: l.cost, value: -val, party: 'Production', ref: why }); }
      t.update('batches', b.id, { goodQty: r4(b.goodQty - d.good), rejectQty: r4(b.rejectQty - d.reject), fgValue: r2((b.fgValue || 0) - val) });
      if (d.reject > 0) { fg._extra = { rejectBal: r4(fg.rejectBal - d.reject), rejectTotal: r4((fg.rejectTotal || 0) - d.reject) }; fg._dirty = true; }
      saveItems(t, its);
    } else if (type === 'WS') {
      const po = await t.get('clientPOs', d.cpoId); if (!po) fail('Client PO not found.');
      const its = await loadItems(t, d.lines.map(l => l.itemId));
      // Pieces from a batch that was closed after this withdrawal come back at the batch's final cost.
      const bmap = {};
      for (const bid of [...new Set(d.lines.flatMap(l => (l.take || []).map(k => k.batchId).filter(Boolean)))]) { const bb = await t.get('batches', bid); if (bb) bmap[bid] = bb; }
      for (const l of d.lines) {
        const it = its[l.itemId];
        const take = (l.take || []).map(k => { const bb = k.batchId && bmap[k.batchId]; return bb && bb.status === 'Closed' && bb.goodQty > 0 ? { ...k, cost: bb.unitCost } : k; });
        restoreTakes(it, take); po.lines[l.idx].served = r4((po.lines[l.idx].served || 0) - l.qty);
        const val = r2(take.reduce((a, k) => a + k.qty * k.cost, 0));
        const orig = r2((l.take || []).reduce((a, k) => a + k.qty * k.cost, 0));
        ledger(t, it, { date, type: 'VOID', docType: type, docId: id, docNo: d.docNo, qty: l.qty, cost: l.qty ? r6(orig / l.qty) : 0, value: orig, party: d.clientName, ref: why });
        // the batch close already booked (final − provisional) for these pieces as issued; take it back
        if (Math.abs(val - orig) >= 0.01) ledger(t, it, { date, type: 'COST', docType: type, docId: id, docNo: d.docNo, qty: 0, cost: 0, value: r2(val - orig), party: d.clientName, ref: 'Returned pieces revalued to the closed batch cost; reverses the close adjustment' });
      }
      t.update('clientPOs', po.id, { lines: po.lines, status: ['Closed', 'Cancelled'].includes(po.status) ? po.status : poStatus(po.lines, 'served') });
      // release the DR No. and WS No. (only index records that exist and belong to this slip)
      for (const k of [d.drKey || (d.drNo ? norm(d.drNo) : ''), d.wsKey || (d.wsFormNo ? 'WSF_' + norm(wsSeries(d.wsFormNo)) : '')].filter(Boolean)) { const ix = await t.get('drIndex', k); if (ix && ix.ref === id) t.del('drIndex', k); }
      saveItems(t, its);
    } else if (type === 'RC') {
      if (!d.itemId) fail('This recrushing log cannot be voided.');
      const its = await loadItems(t, [d.itemId]); const fg = its[d.itemId];
      fg._extra = { rejectBal: r4((fg.rejectBal || 0) + d.qty), recrushTotal: r4((fg.recrushTotal || 0) - d.qty) }; fg._dirty = true;
      saveItems(t, its);
    } else fail('This document type cannot be voided.');
    t.update(col, id, { status: 'Voided', voidReason: reason.trim(), voidBy: ME.uid, voidByName: ME.name, voidAt: nowISO() });
    audit(t, 'Void', type, id, d.docNo, reason.trim());
    return { id, docNo: d.docNo };
  });
}

async function closePO(type, id, reason) {
  if (!can.void()) fail('Only the Administrator or Department Head can close or cancel a PO.');
  const col = DT[type].col, f = type === 'PO' ? 'received' : 'served';
  return DB.tx(async t => {
    const d = await t.get(col, id); if (!d) fail('PO not found.');
    if (!['Open', 'Partial'].includes(d.status)) fail(`PO is already ${d.status}.`);
    const status = d.status === 'Open' ? 'Cancelled' : 'Closed';
    t.update(col, id, { status, closeReason: reason, closedBy: ME.uid, closedByName: ME.name, closedAt: nowISO() });
    audit(t, status === 'Cancelled' ? 'Cancel' : 'Close', type, id, d.docNo, reason);
    return { status };
  });
}

async function amendPO(type, id, qtys, reason) {
  if (!can.po()) fail('You are not allowed to amend POs.');
  const col = DT[type].col, f = type === 'PO' ? 'received' : 'served';
  return DB.tx(async t => {
    const d = await t.get(col, id); if (!d) fail('PO not found.');
    if (!['Open', 'Partial'].includes(d.status)) fail(`PO is already ${d.status}.`);
    const changes = [];
    d.lines.forEach((l, i) => {
      const q = r4(num(qtys[i]));
      if (q + EPS < (l[f] || 0)) fail(`${l.itemName}: quantity cannot be lower than already ${f} (${fq(l[f])}).`);
      if (Math.abs(q - l.qty) > EPS) { changes.push(`${l.itemName}: ${fq(l.qty)} → ${fq(q)}`); l.qty = q; l.amount = r2(q * lockOf(d, i).price); }
    });
    if (!changes.length) fail('No quantity was changed.');
    if (d.lines.every(l => l.qty <= EPS)) fail('All quantities would be zero. Use Cancel PO instead.');
    t.update(col, id, { lines: d.lines, total: r2(d.lines.reduce((s, l) => s + l.amount, 0)), status: poStatus(d.lines, f), amended: true });
    audit(t, 'Amend', type, id, d.docNo, changes.join('; ') + (reason ? ` — ${reason}` : ''));
    return { id };
  });
}

/* ---------------- offline queue ---------------- */
const QK = () => 'bigben_ims_queue_' + (ME?.uid || '');
const Q = {
  all() { try { return JSON.parse(localStorage.getItem(QK()) || '[]'); } catch { return []; } },
  save(a) { localStorage.setItem(QK(), JSON.stringify(a)); netBadge(); }
};
const isOfflineErr = e => e?.code === 'unavailable' || /offline/i.test(e?.message || '');
function enqueue(type, payload) {
  const a = Q.all(); a.push({ qid: payload._id || rid(), type, payload: { ...payload, _queuedAt: nowISO() }, at: nowISO() }); Q.save(a);
  return { queued: true };
}
async function submit(type, payload) {
  payload = { ...payload, _id: payload._id || rid() };   // same id if this posting is retried later
  if (!navigator.onLine && QUEUEABLE.includes(type)) return enqueue(type, payload);
  try { return await POST[type](payload); }
  catch (e) { if (isOfflineErr(e) && QUEUEABLE.includes(type)) return enqueue(type, payload); throw e; }
}
let qBusy = false;
// Only one browser tab at a time posts the offline queue.
async function processQueue() {
  if (navigator.locks) return navigator.locks.request('bigben-ims-queue', { ifAvailable: true }, async lock => { if (lock) await runQueue(); });
  return runQueue();
}
async function runQueue() {
  if (qBusy || !navigator.onLine || !ME) return;
  if (!Q.all().some(x => !x.error)) return;
  qBusy = true; let ok = 0;
  try {
    for (const q of Q.all()) {
      if (q.error) continue;
      try { await POST[q.type](q.payload); Q.save(Q.all().filter(x => x.qid !== q.qid)); ok++; }
      catch (e) {
        if (isOfflineErr(e)) break;
        const a = Q.all(); const x = a.find(z => z.qid === q.qid); if (x) x.error = e.message; Q.save(a);
      }
    }
  } finally { qBusy = false; }
  if (ok) { toast(`${ok} document(s) saved offline were posted.`, 'ok'); if (!$('.mb')) render(); }
  if (Q.all().some(x => x.error)) toast('Some offline documents could not be posted. Open "Pending sync" to review.', 'bad');
}
window.addEventListener('online', () => { netBadge(); processQueue(); });
window.addEventListener('offline', netBadge);
setInterval(processQueue, 60000);

/* ---------------- UI helpers ---------------- */
const M = () => $('#main');
let RSEQ = 0;                                  // increases on every page change
const stale = seq => seq !== RSEQ;             // true when the user has moved to another page
const LST = () => $('#lst') || document.createElement('div');
function toast(msg, kind = '') {
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = msg;
  $('#toast').appendChild(el); setTimeout(() => el.remove(), kind === 'bad' ? 7000 : 4000);
}
function errMsg(e) {
  if (e instanceof UErr) return e.message;
  const c = e?.code || '';

function lineTable(host, { itemType, cols, rows, total, unitPref = 'base', extraUnits = [] }) {
  rows = rows && rows.length ? rows : [{}];
  // unitPref: 'base', 'alt' (first conversion unit) or a unit name such as 'kg'
  const defUnit = it => !it ? '' : unitPref === 'alt' ? (altUnit(it) || it.baseUnit) : unitPref === 'base' ? it.baseUnit : ([...unitsOf(it), ...extraUnits].includes(unitPref) ? unitPref : it.baseUnit);
  const opts = (it, sel) => unitOpts(it, sel, extraUnits);
  const cell = (c, r) => {
    const it = item(r.itemId);
    if (c.kind === 'item') return `<td style="min-width:230px"><select data-k="itemId">${itemOpts(itemType, r.itemId)}</select></td>`;
    if (c.kind === 'unit') return `<td style="width:110px"><select data-k="unit">${it ? opts(it, r.unit || defUnit(it)) : ''}</select></td>`;
    if (c.kind === 'num') return `<td style="width:${c.w || 130}px"><input type="number" step="any" min="0" data-k="${c.k}" value="${esc(r[c.k] ?? '')}"></td>`;
    return `<td class="n"></td>`;
  };
  const draw = () => {
    host.innerHTML = `<div class="tw"><table class="t"><thead><tr><th>#</th>${cols.map(c => `<th class="${c.kind === 'num' || c.kind === 'ro' ? 'n' : ''}">${c.label}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map((r, i) => `<tr data-i="${i}"><td class="muted">${i + 1}</td>${cols.map(c => cell(c, r)).join('')}<td style="width:40px"><button type="button" class="btn sm dng" data-del="${i}" title="Remove line">✕</button></td></tr>`).join('')}</tbody></table></div><div class="row" style="margin-top:8px"><button type="button" class="btn sm" data-add>+ Add line</button><span class="sp"></span><b data-total></b></div>`;
    refresh();
  };
  const refresh = () => {
    $$('tr[data-i]', host).forEach(tr => {
      const r = rows[tr.dataset.i]; const it = item(r.itemId);
      cols.forEach((c, ci) => { if (c.kind === 'ro') tr.children[ci + 1].innerHTML = c.fn(r, it); });
    });
    const t = $('[data-total]', host); if (t && total) t.innerHTML = total(rows);
  };
  host.addEventListener('input', e => {
    const k = e.target.dataset.k; if (!k) return;
    const r = rows[e.target.closest('tr[data-i]').dataset.i]; r[k] = e.target.value;
    if (k === 'itemId') { r.unit = defUnit(item(r.itemId)); draw(); return; }
    refresh();
  });
  host.addEventListener('click', e => {
    if (e.target.closest('[data-add]')) { rows.push({}); draw(); }
    const d = e.target.closest('[data-del]'); if (d) { rows.splice(+d.dataset.del, 1); if (!rows.length) rows.push({}); draw(); }
  });
  draw();
  return { rows, set(r) { rows.length = 0; rows.push(...(r.length ? r : [{}])); draw(); } };
}

function exportRows(name, rows) {
  if (!rows.length) return toast('Nothing to export.', 'bad');
  const fn = `${name}_${today()}`;
  if (window.XLSX) {
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), name.slice(0, 31));
    XLSX.writeFile(wb, fn + '.xlsx');
  } else {

    const csv = [keys, ...rows.map(r => keys.map(k => r[k]))].map(a => a.map(v => { let x = String(v ?? ''); if (/^[=+\-@\t\r]/.test(x) && isNaN(+x)) x = "'" + x; return `"${x.replace(/"/g, '""')}"`; }).join(',')).join('\r\n');

  }
}

  <div class="foot"><span>${type === 'UT' ? 'Generated from the stock ledger' : `Encoded ${fdt(d.ts)} by ${esc(d.byName)}`}${d.queuedAt ? ' (saved offline ' + fdt(d.queuedAt) + ')' : ''}</span><span>Printed ${fdt(nowISO())} by ${esc(ME?.name)}</span></div></div>`;
}
function printHTML(html) {
  // The Receiving Log prints landscape; everything else portrait.
  const land = html.includes('class="paper land');
  // Withdrawal Slip: two copies on one Letter sheet (top and bottom halves), cut along the dashed line.
  if (html.includes('class="paper wslip')) html = `<div class="wsx2">${html}<div class="cut"></div>${html}</div>`;
  const two = html.includes('class="wsx2"');
  $('#print-root').innerHTML = `<style>@page{size:letter ${land ? 'landscape' : 'portrait'};margin:${land ? '.35in' : two ? '.3in .4in' : '.45in'}}</style>` + html;
  document.body.classList.add('printing');
  setTimeout(() => window.print(), 50);
}
window.addEventListener('afterprint', () => document.body.classList.remove('printing'));

async function viewDoc(type, id) {
  let d;
  try { d = await DB.get(DT[type].col, id); } catch (e) { return toast(errMsg(e), 'bad'); }
  if (!d) return toast('Document not found.', 'bad');
  const acts = [];
  const voidable = ['RL', 'MCS', 'OUT', 'WS', 'RC', 'OB'].includes(type);
  if (voidable && d.status === 'Posted' && can.void()) acts.push(`<button class="btn dng" data-a="void">Void…</button>`);
  if ((type === 'PO' || type === 'CPO') && ['Open', 'Partial'].includes(d.status)) {
    if (type === 'PO' && can.encode()) acts.push(`<a class="btn" href="#/rl/new/${encodeURIComponent(d.poNo)}" data-close>Receive delivery</a>`);
    if (type === 'CPO' && can.encode()) acts.push(`<a class="btn" href="#/ws/new/${encodeURIComponent(d.poNo)}" data-close>Withdraw (WS)</a>`);
    if (can.po()) acts.push(`<button class="btn" data-a="amend">Amend qty…</button>`);
    if (can.void()) acts.push(`<button class="btn dng" data-a="close">${d.status === 'Open' ? 'Cancel PO…' : 'Close PO…'}</button>`);
  }
  const html = paper(type, d);
  const m = modal(`${DT[type].short} ${esc(d.docNo)} ${tag(d.status)}`, `<div class="preview">${html}</div>`, { wide: true, foot: `${acts.join('')}<span class="sp"></span><button class="btn" data-close>Close</button><button class="btn pri" data-a="print">Print</button>` });
  m.el.addEventListener('click', async e => {
    const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return;
    try {
      if (a === 'print') printHTML(html);
      if (a === 'void') {
        const why = await askText(`Void ${esc(d.docNo)}?`, 'Reason for voiding (required). Stock will be reversed.', 'Void document', true);
        if (!why) return;
        await voidDoc(type, id, why); toast(`${d.docNo} voided.`, 'ok'); m.close(); render();
      }
      if (a === 'close') {
        const why = await askText(d.status === 'Open' ? 'Cancel PO' : 'Close PO (short-close)', d.status === 'Open' ? 'Reason for cancelling' : 'Reason for closing — remaining balance will no longer be received/served', 'Confirm', true);
        if (!why) return;
        const r = await closePO(type, id, why); toast(`PO ${r.status}.`, 'ok'); m.close(); render();
      }
      if (a === 'amend') { m.close(); amendDialog(type, d); }
    } catch (err) { toast(errMsg(err), 'bad'); }
  });
}
function amendDialog(type, d) {
  const f = type === 'PO' ? 'received' : 'served';
  const m = modal(`Amend ${esc(d.docNo)}`, `<p class="muted" style="margin-top:0">Change ordered quantities. A quantity cannot go below what was already ${f}.</p><div class="tw"><table class="t"><thead><tr><th>Item</th><th class="n">${f[0].toUpperCase() + f.slice(1)}</th><th class="n">New Qty</th></tr></thead><tbody>${d.lines.map((l, i) => `<tr><td>${esc(l.itemName)} <span class="muted">(${esc(l.unit)})</span></td><td class="n">${fq(l[f])}</td><td style="width:140px"><input type="number" step="any" min="0" data-i="${i}" value="${esc(l.qty)}"></td></tr>`).join('')}</tbody></table></div><label class="f" style="margin-top:12px">Reason / reference<input id="am-r"></label>`, { foot: `<span class="sp"></span><button class="btn" data-close>Cancel</button><button class="btn pri" id="am-ok">Save amendment</button>` });
  m.$('#am-ok').onclick = async () => {
    try { await amendPO(type, d.id, $$('input[data-i]', m.el).map(i => i.value), m.$('#am-r').value.trim()); toast('PO amended.', 'ok'); m.close(); render(); }
    catch (e) { toast(errMsg(e), 'bad'); }
  };
}
function afterSave(type, res, route) {
  if (res.queued) { toast('Saved offline. It will be posted automatically when the internet is back.'); location.hash = '#/' + route; return; }
  toast(`Saved ${res.docNo}.`, 'ok'); location.hash = '#/' + route;
  setTimeout(() => viewDoc(type, res.id), 150);
}

async function openBatches() { return (await DB.list('batches', { where: [['status', '==', 'Open']] })).sort((a, b) => a.docNo < b.docNo ? 1 : -1); }
const batchOpts = (bs, sel) => '<option value="">— select batch —</option>' + bs.map(b => `<option value="${esc(b.id)}" ${b.id === sel ? 'selected' : ''}>${esc(b.docNo)} — ${esc(b.fgItemName)} (started ${fd(b.startDate)})</option>`).join('');
const mixText = d => (d?.materials || []).map(m => `${item(m.itemId)?.name || '?'} ${fq(m.qty, 4)} ${m.unit}`).join(' · ');

async function mcsForm(batchArg) {
  const seq = RSEQ; const bs = await openBatches(); if (stale(seq)) return;
  M().innerHTML = page('New Material Consumption', 'Encode raw materials consumed by operations for the day. Stock is deducted (FIFO) when saved.') + (bs.length ? `<form class="card" id="frm">
    <div class="grid"><label class="f">Production Batch *<select name="batchId" id="bsel" required>${batchOpts(bs, batchArg)}</select></label>
    <label class="f">Date *<input type="date" name="date" value="${today()}" required></label>
    <label class="f">Shift / Line<input name="shift" placeholder="optional"></label></div>
    <div id="sofar" style="margin-top:14px"></div>
    <div class="note" style="margin-top:14px"><div class="row"><span>Mix design</span><select id="dsel" style="min-width:200px">${designOpts()}</select><span>×</span><input type="number" id="cyc" name="cycles" min="0" step="any" style="width:100px" placeholder="cycles"><span>cycles</span><button type="button" class="btn sm" id="fillds">Fill target usage</button></div>
    <div id="mixinfo" class="muted" style="margin-top:6px;font-size:13px"></div><div class="muted" style="font-size:13px">Then change the quantities to the <b>actual</b> consumption. The target is kept for target-vs-actual monitoring.</div></div>
    <div id="lines"></div>
    <label class="f" style="margin-top:12px">Remarks<textarea name="remarks" rows="2"></textarea></label>
    <div class="row" style="margin-top:14px"><a class="btn" href="#/mcs">Cancel</a><span class="sp"></span><button class="btn pri">Save &amp; Deduct Stock</button></div></form>`
    : `<div class="note warn">There is no open production batch. ${can.batch() ? '<a href="#/batches">Create a batch first.</a>' : 'Ask the Operations Head to create a batch.'}</div>`);
  if (!bs.length) return;
  const lt = lineTable($('#lines'), { itemType: 'RAW', unitPref: 'alt', cols: [C.item, C.unit, C.qty('Actual Qty'), C.ro('Target', r => r.tgt ? `${fq(r.tgt, 4)} ${esc(r.tgtUnit)}` : ''), C.base, C.onhand] });
  let target = [], targetPcs = 0, fillDs = null;
  const syncDs = () => { const b = bs.find(x => x.id === $('#bsel').value); if (b && !$('#dsel').dataset.touched) $('#dsel').value = b.designId || ''; const d = S.designs.find(x => x.id === $('#dsel').value); $('#mixinfo').textContent = d ? `Per cycle: ${mixText(d)} → ${fq(d.pcsPerCycle)} pcs` : ''; };
  // Shows what this batch has already consumed (all posted slips so far)
  const showSoFar = async () => {
    const el = $('#sofar'); const b = bs.find(x => x.id === $('#bsel').value);
    if (!b) { el.innerHTML = ''; return; }
    el.innerHTML = '<div class="muted">Loading what this batch has consumed so far…</div>';
    let list = [];
    try { list = (await DB.list('consumptions', { where: [['batchId', '==', b.id]] })).filter(x => x.status === 'Posted'); }
    catch (e) { el.innerHTML = `<div class="note warn">Could not load earlier consumption (${esc(errMsg(e))}).</div>`; return; }
    if ($('#bsel').value !== b.id) return;
    if (!list.length) { el.innerHTML = `<div class="card" style="margin:0"><b>Consumed so far — ${esc(b.docNo)}</b><p class="muted" style="margin:6px 0 0">Nothing encoded yet for this batch. This will be the first consumption slip.</p></div>`; return; }
    const tot = {};
    for (const x of list) for (const l of x.lines) {
      const t = tot[l.itemId] || (tot[l.itemId] = { name: l.itemName, unit: l.unit, qty: 0, base: 0, baseUnit: l.baseUnit, mixed: false });
      if (l.unit !== t.unit) t.mixed = true;
      t.qty += l.qty; t.base += l.baseQty;
    }
    list.sort((a, c) => a.date < c.date ? -1 : a.date > c.date ? 1 : (a.docNo < c.docNo ? -1 : 1));
    const last = list[list.length - 1];
    el.innerHTML = `<div class="card" style="margin:0"><div class="row"><b>Consumed so far — ${esc(b.docNo)} (${esc(b.fgItemName)})</b><span class="sp"></span><a href="#/batches/${esc(b.id)}" class="btn sm">Open batch</a></div>
      <div class="kv" style="margin-top:8px"><div><span>Slips encoded</span>${list.length} (last: ${esc(last.docNo)}, ${fd(last.date)})</div><div><span>Cycles so far</span>${fq(b.cycles)}</div><div><span>Target CHB so far</span>${fq(b.targetPcs)} pcs</div><div><span>Good / reject so far</span>${fq(b.goodQty)} / ${fq(b.rejectQty)} pcs</div></div>
      <div class="tw"><table class="t"><thead><tr><th>Material</th><th class="n">Total consumed</th><th class="n">In stock unit</th></tr></thead><tbody>${Object.values(tot).map(t => `<tr><td>${esc(t.name)}</td><td class="n">${t.mixed ? '' : `${fq(t.qty, 3)} ${esc(t.unit)}`}</td><td class="n">${fq(t.base, 4)} ${esc(t.baseUnit)}</td></tr>`).join('')}</tbody></table></div></div>`;
  };
  $('#bsel').onchange = () => { syncDs(); showSoFar(); }; $('#dsel').onchange = e => { e.target.dataset.touched = 1; syncDs(); }; syncDs(); showSoFar();
  $('#fillds').onclick = () => {
    const ds = S.designs.find(d => d.id === $('#dsel').value); const cyc = num($('#cyc').value);
    if (!ds) return toast('Select a mix design.', 'bad'); if (cyc <= 0) return toast('Enter the number of cycles.', 'bad');
    fillDs = ds; targetPcs = r4((ds.pcsPerCycle || 0) * cyc);
    target = (ds.materials || []).map(m => ({ itemId: m.itemId, unit: m.unit, qty: r4(m.qty * cyc) }));
    lt.set(target.map(m => ({ itemId: m.itemId, unit: m.unit, qty: String(m.qty), tgt: m.qty, tgtUnit: m.unit })));
    $('#mixinfo').innerHTML = `Per cycle: ${esc(mixText(ds))}<br><b>Target for ${fq(cyc)} cycles: ${fq(targetPcs)} pcs CHB</b>`;
  };
  onSubmit($('#frm'), async f => {
    const cyc = num(f.cycles), ds = S.designs.find(d => d.id === $('#dsel').value);
    if (cyc > 0 && !ds) fail('Select the mix design for the cycles.');
    const useT = cyc > 0 && ds;
    afterSave('MCS', await submit('MCS', { ...f, lines: lt.rows.map(({ tgt, tgtUnit, ...r }) => r), designId: useT ? ds.id : '', designName: useT ? ds.name : '', target: useT ? (ds.materials || []).map(m => ({ itemId: m.itemId, unit: m.unit, qty: r4(m.qty * cyc) })) : [], targetPcs: useT ? r4((ds.pcsPerCycle || 0) * cyc) : 0 }), 'mcs');
  });
}

async function batchesView(id) {
  if (id) return batchDetail(id);
  const st = LS.PB || (LS.PB = { status: 'Open', q: '' });
  M().innerHTML = page('Production Batches', 'One batch per CHB product run. It can span several days, and several batches can be open at once.', can.batch() ? '<button class="btn pri" id="nb">+ New Batch</button>' : '') +
    `<div class="card"><div class="bar"><label class="f">Status<select id="f-st"><option value="">All</option><option ${st.status === 'Open' ? 'selected' : ''}>Open</option><option ${st.status === 'Closed' ? 'selected' : ''}>Closed</option></select></label><label class="f" style="flex:1;min-width:200px">Search<input id="f-q" value="${esc(st.q || '')}" placeholder="Batch no., product or mix design"></label><button class="btn" id="xl">Export Excel</button></div><div id="lst"><div class="loading">Loading…</div></div></div>`;
  let rows = [];
  const seq = RSEQ;
  try { rows = await DB.list('batches', { order: ['startDate', 'desc'], limit: 500 }); if (stale(seq)) return; } catch (e) { if (stale(seq)) return; LST().innerHTML = `<div class="note bad">${esc(errMsg(e))}</div>`; }
  const draw = () => {
    const q = (st.q || '').toLowerCase();
    const r = rows.filter(b => (!st.status || b.status === st.status) && (!q || [b.docNo, b.fgItemName, b.fgCode, b.designName].join(' ').toLowerCase().includes(q)));
    LST().innerHTML = r.length ? `<div class="tw"><table class="t"><thead><tr><th>Batch No.</th><th>Product</th><th>Started</th><th class="n">Cycles</th><th class="n">Target</th><th class="n">Good</th><th class="n">Reject</th><th class="n">Materials Cost</th><th class="n">Cost / good pc</th><th>Status</th></tr></thead><tbody>${r.map(b => `<tr class="click" data-id="${esc(b.id)}"><td><b>${esc(b.docNo)}</b></td><td>${esc(b.fgItemName)}<br><span class="muted">${esc(b.designName)}</span></td><td>${fd(b.startDate)}</td><td class="n">${fq(b.cycles)}</td><td class="n">${fq(b.targetPcs)}</td><td class="n">${fq(b.goodQty)}</td><td class="n">${fq(b.rejectQty)}</td><td class="n">${fp(b.materialCost)}</td><td class="n">${b.goodQty ? fc(b.status === 'Closed' ? b.unitCost : b.materialCost / b.goodQty) : '—'}</td><td>${tag(b.status)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No batches.</div>';
    return r;
  };
  draw();

async function batchDetail(id) {
  const seq = RSEQ;
  const b = await DB.get('batches', id); if (stale(seq)) return; if (!b) { M().innerHTML = '<div class="note bad">Batch not found.</div>'; return; }
  const [mcs, outs] = await Promise.all([DB.list('consumptions', { where: [['batchId', '==', id]] }), DB.list('outputs', { where: [['batchId', '==', id]] })]);
  if (stale(seq)) return;
  mcs.sort((a, b2) => a.docNo < b2.docNo ? -1 : 1); outs.sort((a, b2) => a.docNo < b2.docNo ? -1 : 1);
  const open = b.status === 'Open';
  const unit = b.goodQty ? (b.status === 'Closed' ? b.unitCost : b.materialCost / b.goodQty) : 0;
  // target vs actual (target comes from the mix design × cycles encoded on each consumption slip)
  const tv = {}, posted = mcs.filter(x => x.status === 'Posted');
  const toUnit = (it, baseQty, unit, date) => { try { return baseQty / factorOf(it, unit, date); } catch { return null; } };
  for (const x of posted) for (const g of x.target || []) {          // 1) targets, in the first unit seen per item
    const it = item(g.itemId); const row = tv[g.itemId] || (tv[g.itemId] = { itemId: g.itemId, unit: g.unit, tgt: 0, act: 0, bad: false });
    if (g.unit === row.unit) row.tgt += g.qty; else { const q = it ? toUnit(it, g.qty * factorOf(it, g.unit, x.date), row.unit, x.date) : null; if (q === null) row.bad = true; else row.tgt += q; }
  }
  for (const x of posted) for (const l of x.lines) {                  // 2) actuals, converted to that unit
    const it = item(l.itemId); const row = tv[l.itemId] || (tv[l.itemId] = { itemId: l.itemId, unit: l.unit, tgt: 0, act: 0, bad: false });
    if (l.unit === row.unit) row.act += l.qty; else { const q = it ? toUnit(it, l.baseQty, row.unit, x.date) : null; if (q === null) row.bad = true; else row.act += q; }
  }
  const tvRows = Object.values(tv);
  const produced = (b.goodQty || 0) + (b.rejectQty || 0);
  M().innerHTML = page(`Batch ${esc(b.docNo)} ${tag(b.status)}`, `${esc(b.fgItemName)} · mix ${esc(b.designName)} · started ${fd(b.startDate)}${b.closeDate ? ' · closed ' + fd(b.closeDate) : ''}`,
    `<a class="btn" href="#/batches">← All batches</a>${open && can.encode() ? `<a class="btn" href="#/mcs/new/${esc(id)}">+ Material Consumption</a><a class="btn" href="#/out/new/${esc(id)}">+ Output</a>` : ''}${open && can.batch() ? '<button class="btn dng" id="close">Close Batch…</button>' : ''}<button class="btn pri" id="pr">Print Summary</button>`) +
    `<div class="kpis"><div class="kpi"><span>Cycles</span><b>${fq(b.cycles)}</b></div><div class="kpi"><span>Target CHB</span><b>${fq(b.targetPcs)}</b></div><div class="kpi ${b.targetPcs && b.goodQty < b.targetPcs ? 'alert' : ''}"><span>Good pieces${b.targetPcs ? ` (${fq(b.goodQty / b.targetPcs * 100, 1)}% of target)` : ''}</span><b>${fq(b.goodQty)}</b></div><div class="kpi"><span>Rejects</span><b>${fq(b.rejectQty)}</b></div><div class="kpi"><span>Materials cost (FIFO)</span><b>${fp(b.materialCost)}</b></div><div class="kpi"><span>Cost per good pc ${open ? '(provisional)' : '(final)'}</span><b>${unit ? fc(unit) : '—'}</b></div></div>
    ${tvRows.length ? `<div class="card"><h3>Target vs Actual</h3><div class="tw"><table class="t"><thead><tr><th>Material</th><th class="n">Target</th><th class="n">Actual</th><th class="n">Variance</th><th>Status</th></tr></thead><tbody>${tvRows.map(r => { const v = r.act - r.tgt; return `<tr><td>${esc(item(r.itemId)?.name || '?')}</td><td class="n">${fq(r.tgt, 2)} ${esc(r.unit)}</td><td class="n">${fq(r.act, 2)} ${esc(r.unit)}</td><td class="n" style="color:${v > EPS ? 'var(--bad)' : 'var(--ok)'}">${v > 0 ? '+' : ''}${fq(v, 2)}</td><td>${r.bad ? '<span class="tag warn">Unit mismatch: set the conversion in Items &amp; Units</span>' : r.tgt ? (v > EPS ? '<span class="tag bad">Over target</span>' : '<span class="tag ok">Within target</span>') : '<span class="tag">No target</span>'}</td></tr>`; }).join('')}
      <tr><td><b>CHB output (good + reject)</b></td><td class="n">${fq(b.targetPcs)} pcs</td><td class="n">${fq(produced)} pcs</td><td class="n" style="color:${produced < b.targetPcs ? 'var(--bad)' : 'var(--ok)'}">${produced - b.targetPcs > 0 ? '+' : ''}${fq(produced - b.targetPcs)}</td><td>${b.targetPcs ? (produced < b.targetPcs ? '<span class="tag bad">Below target</span>' : '<span class="tag ok">On target</span>') : ''}</td></tr>
      <tr><td><b>Rejects</b></td><td class="n">—</td><td class="n">${fq(b.rejectQty)} pcs</td><td></td><td>${b.rejectQty > 0 ? '<span class="tag warn">Has rejects</span>' : '<span class="tag ok">No rejects</span>'}</td></tr></tbody></table></div></div>` : ''}
    <div class="card"><h3>Material Consumption</h3>${mcs.length ? `<div class="tw"><table class="t"><thead><tr><th>MCS No.</th><th>Date</th><th class="n">Cycles</th><th>Materials</th><th class="n">FIFO Cost</th><th>Status</th></tr></thead><tbody>${mcs.map(x => `<tr class="click" data-t="MCS" data-id="${esc(x.id)}"><td><b>${esc(x.docNo)}</b></td><td>${fd(x.date)}</td><td class="n">${x.cycles ? fq(x.cycles) : ''}</td><td>${x.lines.map(l => `${esc(l.itemName)} ${fq(l.qty)} ${esc(l.unit)}`).join('; ')}</td><td class="n">${fp(x.total)}</td><td>${tag(x.status)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No consumption encoded yet.</div>'}</div>
    <div class="card"><h3>Output Reports</h3>${outs.length ? `<div class="tw"><table class="t"><thead><tr><th>Output No.</th><th>Date</th><th class="n">Good</th><th class="n">Reject</th><th>Reject reason</th><th>Status</th></tr></thead><tbody>${outs.map(x => `<tr class="click" data-t="OUT" data-id="${esc(x.id)}"><td><b>${esc(x.docNo)}</b></td><td>${fd(x.date)}</td><td class="n">${fq(x.good)}</td><td class="n">${fq(x.reject)}</td><td>${esc(x.rejectReason)}</td><td>${tag(x.status)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No output encoded yet.</div>'}</div>
    ${!open && (b.costAdjOnHand || b.costAdjIssued) ? `<div class="note">At closing, finished goods from this batch were revalued to the final cost: ${fp(b.costAdjOnHand)} on stock still on hand and ${fp(b.costAdjIssued)} on pieces already withdrawn.</div>` : ''}`;
  M().onclick = e => { const tr = e.target.closest('tr[data-t]'); if (tr) viewDoc(tr.dataset.t, tr.dataset.id); };
  $('#pr').onclick = () => printHTML(paper('PB', b, { mcs, outs }));
  const cl = $('#close'); if (cl) cl.onclick = async () => {
    if (!await confirmBox(`Close batch <b>${esc(b.docNo)}</b>? The final cost per good piece will be ${b.goodQty ? '<b>' + fc(b.materialCost / b.goodQty) + '</b>' : 'zero (no good output)'}. No more consumption or output can be encoded for this batch.`, 'Close Batch', true)) return;
    try { await POST.CLOSE({ batchId: id, date: today() }); toast(`Batch ${b.docNo} closed.`, 'ok'); render(); } catch (e) { toast(errMsg(e), 'bad'); }
  };
}

      const after = mine.filter(l => l.date > st.to).reduce((a, l) => a + l.qty, 0);
      const inP = mine.filter(l => l.date <= st.to);
      const sum = f => inP.filter(f).reduce((a, l) => a + l.qty, 0);
      const end = r4(it.qty - after);
      const inn = r4(sum(l => l.docType === (raw ? 'RL' : 'OUT')));
      const out = r4(-sum(l => l.docType === (raw ? 'MCS' : 'WS')));
      const other = r4(sum(l => !['OB', 'RL', 'OUT', 'MCS', 'WS'].includes(l.docType)));
      const beg = r4(end - inn + out - other); // includes any beginning balance posted inside the period
      const min = it.reorderPoint || 0;
      const status = end <= EPS || (min > 0 && end <= min) ? 'Need to Purchase' : 'Stocks';
      return { id: it.id, code: it.code, name: it.name, unit: it.baseUnit, beg, inn, out, other, end, min, status };
    });

  };
  $('#f-go').onclick = gen;
  $('#lst').onclick = e => { const tr = e.target.closest('tr[data-id]'); if (tr) location.hash = '#/ledger/' + tr.dataset.id; };
  $('#xl').onclick = () => exportRows(st.kind === 'RAW' ? 'RM_Utilization' : 'FG_Status', rows.map(r => ({ Code: r.code, Description: r.name, 'U/M': r.unit, Beginning: r.beg, [st.kind === 'RAW' ? 'Deliveries' : 'Production']: r.inn, [st.kind === 'RAW' ? 'Consumption' : 'Issuance']: r.out, Other: r.other, Ending: r.end, ...(st.kind === 'RAW' ? { Minimum: r.min, Status: r.status } : {}) })));
  $('#pr').onclick = () => { if (!rows.length) return toast('Generate the report first.', 'bad'); printHTML(paper('UT', { docNo: `${st.kind === 'RAW' ? 'Raw Materials' : 'Finished Products'} · ${fd(st.from)} – ${fd(st.to)}`, kind: st.kind, from: st.from, to: st.to, rows, status: 'Posted', byName: ME.name, ts: nowISO() })); };
  await gen();
}

async function saveMaster(col, id, data, label) {
  return DB.tx(async t => {
    const before = id ? await t.get(col, id) : null;
    const nid = id || DB.newId(col);
    if (before) t.update(col, nid, { ...data, updatedAt: nowISO() });
    else t.set(col, nid, { ...data, active: data.active ?? true, createdAt: nowISO(), createdBy: ME.uid });
    const changed = before ? Object.keys(data).filter(k => JSON.stringify(before[k]) !== JSON.stringify(data[k])).join(', ') : 'created';
    audit(t, before ? 'Update' : 'Create', col, nid, label, changed);
    return nid;
  });
}
